/* RouteRegie Premium — dashboard ontworpen voor de iPad */
body.is-driving{overflow-x:hidden}
body.is-driving .app{max-width:1480px;padding:12px 18px 18px}
body.is-driving .top{margin:0 0 10px}
body.is-driving .logo{width:37px;height:37px;border-radius:11px;font-size:18px}
body.is-driving .brand h1{font-size:17px}
body.is-driving .brand p{font-size:10px}
.drive-screen{width:100%;min-width:0}
.drive-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.drive-title{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.drive-title h2{margin:0;font-size:clamp(17px,2vw,23px);font-weight:850;letter-spacing:-.035em}
.drive-title small{color:#a5bbcf;font-size:11px}
.drive-head .btn-ghost{white-space:nowrap;min-height:32px;padding:6px 10px;font-size:11px}
.drive-main{display:grid;grid-template-columns:minmax(0,1fr) 145px 210px;gap:12px;align-items:stretch}
.drive-rail,.drive-vertical,.drive-commands,.drive-next,.drive-upcoming,.drive-settings{border:1px solid #29465e;background:linear-gradient(145deg,#11263b,#101e31);border-radius:17px;min-width:0;box-shadow:0 10px 27px #0003}
.drive-rail{padding:15px 14px 10px;background:radial-gradient(circle at 76% 0%,#1a405a 0,transparent 43%),linear-gradient(150deg,#122b40,#0c1d31)}
.drive-rail-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.drive-rail-head strong{font-size:14px;letter-spacing:.015em}
.drive-rail-head .rail-count{font-size:11px;color:#b6cede;white-space:nowrap}
.rail-window{margin-top:6px;min-height:149px;position:relative;overflow:hidden}
.rail-track{position:relative;height:141px;--station-count:5}
.rail-track::before{content:"";position:absolute;left:calc(50% / var(--station-count));right:calc(50% / var(--station-count));top:57px;height:5px;border-radius:12px;background:#36536b}
.rail-fill{position:absolute;left:calc(50% / var(--station-count));top:57px;height:5px;border-radius:12px;background:linear-gradient(90deg,#59dfb2,#56b9f5);width:0;transition:width .5s linear}
.rail-nodes{display:grid;grid-template-columns:repeat(var(--station-count),minmax(0,1fr));height:100%;position:relative;z-index:2}
.rail-node{position:relative;min-width:0;text-align:center;padding:0 5px}
.rail-dot{display:block;width:16px;height:16px;border-radius:50%;position:absolute;top:51.5px;left:50%;transform:translate(-50%,-50%);background:#142b42;border:3px solid #66839d;box-shadow:0 0 0 3px #102437;z-index:3}
.rail-node.is-done .rail-dot{background:#58e0b2;border-color:#3b9584}
.rail-node.is-here .rail-dot{background:#ffd579;border-color:#b8965b;box-shadow:0 0 0 5px #ffcc7521}
.rail-node.is-next .rail-dot{background:#53b7ff;border-color:#8bd4ff;box-shadow:0 0 0 5px #53b7ff22}
.rail-labels{position:absolute;top:77px;left:0;right:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.rail-name{font-size:11.5px;font-weight:750;line-height:1.25;max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:28px}

<body><div id="app"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='tsw_routeregie_segments_v2', OLD='tsw_routeregie_v1';
const $=s=>document.querySelector(s), newid=()=>('id'+Math.random().toString(36).slice(2,11));
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stop=name=>({id:newid(),name});
const segment=(name,names)=>({id:newid(),name,stops:names.map(stop)});
const example=()=>({id:newid(),name:'East Coastway',segments:[segment('Brighton → Lewes',['Brighton','London Road','Moulsecoomb','Falmer','Lewes']),segment('Lewes → Brighton',['Lewes','Falmer','Moulsecoomb','London Road','Brighton'])]});
let routes=[example()],routeId=routes[0].id,segmentId=routes[0].segments[0].id,phase='segments',mode='setup',times={},run=null,toastTimer;
function clean(raw){if(!raw||typeof raw!=='object')return null;return {id:String(raw.id||newid()),name:String(raw.name||'Route'),segments:(Array.isArray(raw.segments)?raw.segments:[]).slice(0,150).map(x=>({id:String(x.id||newid()),name:String(x.name||'Segment'),stops:(Array.isArray(x.stops)?x.stops:[]).slice(0,120).map(y=>({id:String(y.id||newid()),name:String(y.name||'Station')}))}))};}
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.routes?.length){routes=saved.routes.map(clean).filter(Boolean);routeId=saved.routeId;segmentId=saved.segmentId;}else{let old=JSON.parse(localStorage.getItem(OLD)||'null');if(old?.routes?.length){routes=old.routes.map(clean).filter(Boolean);routeId=old.selectedRoute;segmentId=old.selectedSegment;}}}catch(e){}
function r(){return routes.find(x=>x.id===routeId)||routes[0]}
function s(){return r()?.segments.find(x=>x.id===segmentId)||r()?.segments[0]}
function ensure(){if(!routes.length)routes=[example()];routeId=r().id;if(!r().segments.length)r().segments=[segment('Nieuw segment',['Vertrekstation','Eindstation'])];segmentId=s().id;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({routes,routeId,segmentId}));}catch(e){notify('Opslaan is niet mogelijk in deze browser. Maak een back-up.');}}
function notify(msg){let e=$('#toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),3300);}
function clearTimes(){times={};}
function currentTimes(){return s().stops.map(p=>({id:p.id,name:p.name,arrival:times[p.id]?.arrival||'',departure:times[p.id]?.departure||''}));}
function mm(v){let m=/^([01]\d|2[0-3]):([0-5]\d)(?::([0-5]\d))?$/.exec((v||'').trim());return m?(+m[1])*3600+(+m[2])*60+(+(m[3]||0)):null;}
const clock=s=>{s=((Math.floor(s)%86400)+86400)%86400;return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const duration=v=>{v=Math.abs(Math.ceil(v));let h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=v%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');};
function plan(stops){let start=mm(stops[0]?.departure);if(start===null)return {base:null,stops:stops.map(()=>({arrival:null,departure:null})),error:null};let last=start,output=[];for(let i=0;i<stops.length;i++){let row={arrival:null,departure:null};for(let type of (i===0?['departure']:['arrival','departure'])){let x=mm(stops[i][type]);if(x===null)continue;let val=Math.floor(last/86400)*86400+x;if(val<last){if(last-val>43200)val+=86400;else return {base:start,stops:output,error:'Een tijd bij '+stops[i].name+' is eerder dan de vorige tijd.'};}row[type]=(val-start);last=val;}output.push(row);}return {base:start,stops:output,error:null};}
function header(){return `<header class="top"><div class="brand"><div class="logo">↗</div><div><h1>TSW RouteRegie</h1><p>Premium machinistenscherm · tijden per rit</p></div></div><span class="tag">● SAFARI · PREMIUM</span></header>`;}
function toolbar(){return `<div class="button-row"><button class="btn-soft btn-small" data-action="export">↓ Back-up</button><button class="btn-soft btn-small" data-action="import">↑ Importeren</button><input hidden id="fileImport" type="file" accept=".json,application/json"></div>`;}
function stationRow(p,i,length){return `<div class="station-row" data-id="${escapeHtml(p.id)}"><div class="station-name"><span class="num">${i+1}</span><input aria-label="Station ${i+1}" data-field="name" maxlength="120" value="${escapeHtml(p.name)}" placeholder="Naam station"></div><div class="small muted">${i===0?'Vertrekpunt':i===length-1?'Eindpunt':'Tussenhalte'}</div><div class="small muted">Opgeslagen halte</div><div class="row-actions"><button class="btn-soft icon-btn" data-action="up" data-id="${escapeHtml(p.id)}" ${i===0?'disabled':''}>↑</button><button class="btn-soft icon-btn" data-action="down" data-id="${escapeHtml(p.id)}" ${i===length-1?'disabled':''}>↓</button><button class="btn-danger icon-btn" data-action="deleteStop" data-id="${escapeHtml(p.id)}" ${length<=2?'disabled':''}>×</button></div></div>`;}
function timingRows(){let stops=s().stops;return stops.map((p,i)=>{let t=times[p.id]||{};return `<div class="setup-time-row" data-id="${escapeHtml(p.id)}"><div class="tname">${i+1}. ${escapeHtml(p.name)}</div><div><label for="arrival_${i}">Aankomst</label><input id="arrival_${i}" data-time="arrival" type="time" step="1" value="${escapeHtml(t.arrival||'')}" ${i===0?'disabled':''}></div><div><label for="departure_${i}">Vertrek</label><input id="departure_${i}" data-time="departure" type="time" step="1" value="${escapeHtml(t.departure||'')}" ${i===stops.length-1?'disabled':''}></div></div>`}).join('');}
function setup(){ensure();let rr=r(),ss=s(),ready=currentTimes(),p=plan(ready);return `${header()}<div class="kicker">Jouw eigen routes & haltes</div><h2 class="headline">Premium routeplanner. Elke rit nieuwe tijden.</h2><p class="muted intro">Je opgeslagen segment bevat alleen stations en de volgorde. Wanneer je gaat rijden, vul je de tijden apart in. Na de rit blijft het segment bewaard.</p><div class="layout"><aside class="panel sidebar"><h3 class="section-title">01 / Route kiezen</h3><div class="field"><label for="routeSelect">Route</label><select id="routeSelect">${routes.map(x=>`<option value="${escapeHtml(x.id)}" ${x.id===rr.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="button-row"><button class="btn-blue btn-small" data-action="addRoute">+ Route</button><button class="btn-danger btn-small" data-action="deleteRoute">Verwijder</button></div><div class="field"><label for="routeName">Naam route</label><input id="routeName" maxlength="90" value="${escapeHtml(rr.name)}"></div><div class="separator"></div><h3 class="section-title">02 / Segment kiezen</h3><div class="field"><label for="segmentSelect">Opgeslagen segmenten</label><select id="segmentSelect">${rr.segments.map(x=>`<option value="${escapeHtml(x.id)}" ${x.id===ss.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div><div class="button-row"><button class="btn-blue btn-small" data-action="addSegment">+ Segment</button><button class="btn-danger btn-small" data-action="deleteSegment">Verwijder</button></div><div class="field"><label for="segmentName">Naam segment</label><input id="segmentName" maxlength="100" value="${escapeHtml(ss.name)}"></div><button class="btn-ghost btn-small w100" data-action="reverse">⇄ Maak omgekeerde rijrichting</button><div class="separator"></div><h3 class="section-title">03 / Back-up</h3><p class="small muted">Je segmenten blijven opgeslagen in Safari op dit apparaat. Maak af en toe een back-up.</p>${toolbar()}</aside><main class="panel editor"><div class="tabrow"><button class="btn-soft ${phase==='segments'?'active':''}" data-action="tabSegments">1 · Segment beheren</button><button class="btn-soft ${phase==='times'?'active':''}" data-action="tabTimes">2 · Tijden invullen & rijden</button></div>${phase==='segments'?`<div class="ed-head"><div><div class="phase-label">Vaste gegevens</div><h2>${escapeHtml(ss.name)}</h2><p class="muted">Alleen de stations die je hier toevoegt, worden bewaard. Hier hoef je géén tijden in te vullen.</p></div><span class="pill">${ss.stops.length} stations</span></div><div class="station-header"><div>Station</div><div>Type</div><div>Opslag</div><div>Volgorde</div></div><div id="stations">${ss.stops.map((x,i)=>stationRow(x,i,ss.stops.length)).join('')}</div><div class="segment-actions"><button class="btn-blue" data-action="addStop">+ Tussenstation toevoegen</button><button class="btn-soft" data-action="saveSegment">✓ Segment opslaan</button></div><div class="segment-help">✓ Segmenten worden ook automatisch opgeslagen. Kies later ditzelfde segment uit de dropdown om er opnieuw mee te rijden.</div><div class="bottom-actions"><span class="muted small">${escapeHtml(ss.stops[0]?.name)} → ${escapeHtml(ss.stops.at(-1)?.name)}</span><button class="btn-primary" data-action="tabTimes">Verder → Tijden instellen</button></div>`:`<div class="ed-head"><div><div class="phase-label">Tijdelijke ritgegevens</div><h2>${escapeHtml(ss.name)}</h2><p class="muted">Vul nu alleen de tijden voor de rit die je gaat spelen in. Je stations blijven intact en de tijden worden <strong>niet</strong> in het segment opgeslagen. Je kunt nu werken met <strong>uren, minuten én seconden</strong>.</p></div><span class="pill">${ss.stops.length} stations</span></div><div class="summaryline"><span>${escapeHtml(ss.stops[0]?.name)} → ${escapeHtml(ss.stops.at(-1)?.name)}</span><button class="btn-ghost btn-small" data-action="clearTimes">↺ Tijden wissen</button></div><div class="run-editor">${timingRows()}</div><p class="helper-note">Vul bij het beginstation de vertrektijd in en bij volgende stations de aankomsttijd. Vertrektijden bij tussenhaltes zijn optioneel. Gebruik bij voorkeur het formaat <strong>uu:mm:ss</strong>. Zonder tijden kun je de stationsvolger ook handmatig gebruiken, maar dan is er geen countdown. Rit over middernacht wordt ondersteund.</p>${p.error?`<div class="notice warn">⚠ ${escapeHtml(p.error)}</div>`:`<div class="notice">ⓘ Start zodra je in het spel vertrekt. De countdown en treinanimatie volgen je ingevulde tijden tot op de seconde; gebruik Sync om de klok handmatig gelijk te zetten.</div>`}<div class="bottom-actions"><button class="btn-soft" data-action="tabSegments">← Haltes bekijken</button><button class="btn-primary start-btn" data-action="start" ${p.error?'disabled':''}>▶ Start rit</button></div>`}</main></div><div class="footer">Opslag van segmenten is lokaal in deze browser. Gebruik Back-up bij wisselen van apparaat of websiteadres.</div>`;}
function elapsed(){return run.baseElapsed+(run.paused?0:(Date.now()-run.anchor)/1000);}
function target(i){let x=run?.plan.stops[i];return x?(x.arrival??x.departure):null;}
function count(){if(run.index>=run.stops.length-1)return {value:'—',late:false,text:'Eindstation bereikt'};let x=target(run.index+1);if(x===null||run.plan.base===null)return {value:'—:—:—',late:false,text:'Geen aankomsttijd ingevuld'};let v=x-elapsed();return {value:duration(v),late:v<0,text:v<0?'Aankomsttijd verstreken':run.paused?'Gepauzeerd':'Tot volgende halte'};}
function segmentProg(){if(!run)return {available:false,current:'',next:'',percent:0,text:'Geen rit actief'};let pos=run.index,stops=run.stops,current=stops[pos]?.name||'',next=stops[pos+1]?.name||'';if(pos>=stops.length-1)return {available:false,current,next:'',percent:100,text:'Eindstation bereikt'};if(run.plan.base===null)return {available:false,current,next,percent:0,text:'Geen tijden ingevuld'};let curPlan=run.plan.stops[pos]||{},nextPlan=run.plan.stops[pos+1]||{};let startMin=(curPlan.departure??curPlan.arrival);let endMin=(nextPlan.arrival??nextPlan.departure);if(startMin===null||endMin===null||endMin<=startMin)return {available:false,current,next,percent:0,text:'Onvoldoende tijden voor animatie'};let total=(endMin-startMin),done=elapsed()-startMin,pct=Math.max(0,Math.min(1,done/total));let remain=Math.max(0,total-done);return {available:true,current,next,percent:pct*100,text:run.paused?'Trein gepauzeerd':(done<0?'Vertrekt zo':(done>total?'Aankomsttijd bereikt':'Nog '+duration(remain)+' tot '+next))};}
function fullRouteProg(){if(!run)return 0;let segments=Math.max(1,run.stops.length-1),base=(run.index/segments)*100,sp=segmentProg();if(sp.available)return Math.max(0,Math.min(100,base+(sp.percent/segments)));return base;}
function sngTrainSVG(){return `<svg viewBox="0 0 180 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="sngBody" x1="0" x2="1"><stop offset="0" stop-color="#ffde3b"/><stop offset="1" stop-color="#ffc500"/></linearGradient><linearGradient id="sngBlue" x1="0" x2="1"><stop offset="0" stop-color="#1b75d1"/><stop offset="1" stop-color="#0f56a6"/></linearGradient></defs><rect x="18" y="18" width="126" height="34" rx="13" fill="url(#sngBody)" stroke="#f7f1c0" stroke-width="2"/><path d="M144 22c12 4 20 12 22 22-1 10-8 15-20 15h-26V22z" fill="url(#sngBlue)"/><path d="M22 48h128l-8 12H34c-7 0-12-3-12-8z" fill="url(#sngBlue)" opacity=".95"/><rect x="34" y="25" width="20" height="11" rx="3" fill="#173957"/><rect x="58" y="25" width="20" height="11" rx="3" fill="#173957"/><rect x="82" y="25" width="20" height="11" rx="3" fill="#173957"/><rect x="106" y="25" width="20" height="11" rx="3" fill="#173957"/><path d="M130 24h9c8 0 13 6 14 12h-23z" fill="#d6efff" opacity=".9"/><circle cx="53" cy="62" r="7" fill="#dcefff"/><circle cx="118" cy="62" r="7" fill="#dcefff"/><circle cx="53" cy="62" r="3" fill="#35536d"/><circle cx="118" cy="62" r="3" fill="#35536d"/><path d="M24 18l-6 7v8" stroke="#d5f0ff" stroke-width="2" opacity=".45"/><path d="M36 17l-7 11M66 17l-7 11M96 17l-7 11" stroke="#fff8cb" stroke-width="2" opacity=".35"/></svg>`;}
function upcomingMarkup(stops,pos){let upcoming=stops.slice(pos+1,pos+4);if(!upcoming.length)return '<div class="premium-note">Geen volgende stations meer. Je bent aan het eind van de rit.</div>';return `<div class="upcoming-list">${upcoming.map((p,idx)=>`<div class="upcoming-item"><div><strong>${escapeHtml(p.name)}</strong><div class="meta">${idx===0?'Volgende halte':idx===1?'Daarna':'Later op de route'}</div></div><div class="time">${escapeHtml(p.arrival||p.departure||'—:—:—')}</div></div>`).join('')}</div>`;}
function visibleStops(){let total=run.stops.length,shown=Math.min(5,total),first=Math.min(Math.max(0,run.index-1),Math.max(0,total-shown));return {first,shown,stops:run.stops.slice(first,first+shown)};}
function railPos(){let w=visibleStops(),den=Math.max(1,w.shown-1),sp=segmentProg(),relative=run.index-w.first+(sp.available?sp.percent/100:0);return Math.max(0,Math.min(100,100*relative/den));}
function compactUpcoming(){let next=run.stops.slice(run.index+1,run.index+4);if(!next.length)return '<div class="compact-stop"><span class="index">✓</span><span class="name">Eindstation bereikt</span><span class="time">—</span></div>';return next.map((p,i)=>`<div class="compact-stop"><span class="index">${i+1}</span><span class="name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span><span class="time">${escapeHtml(p.arrival||p.departure||'—:—:—')}</span></div>`).join('');}
function runView(){let pos=run.index,stops=run.stops,next=stops[pos+1],c=count(),sp=segmentProg(),w=visibleStops(),rpos=railPos();return `${header()}<section class="drive-screen"><div class="drive-head"><div class="drive-title"><h2>${escapeHtml(run.segmentName)}</h2><small>${escapeHtml(run.routeName)} · ${stops.length} haltes</small></div><button class="btn-ghost btn-small" data-action="finish">■ Rit afsluiten</button></div><div class="drive-main"><section class="drive-rail"><div class="drive-rail-head"><strong>Routelijn</strong><span class="rail-count">${pos+1} van ${stops.length} · ${Math.max(0,stops.length-pos-1)} te gaan</span></div><div class="rail-window"><div class="rail-track" style="--station-count:${w.shown}"><div class="rail-fill" id="railFill"></div><div class="rail-marker" id="railMarker">${sngTrainSVG()}</div><div class="rail-nodes">${w.stops.map((p,j)=>{let i=w.first+j;return `<div class="rail-node ${i<pos?'is-done':i===pos?'is-here':i===pos+1?'is-next':'is-future'}"><span class="rail-dot"></span><div class="rail-labels"><span class="rail-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span><span class="rail-time">${escapeHtml(p.arrival||p.departure||'—:—:—')}</span></div></div>`;}).join('')}</div></div></div><div class="rail-foot"><span>NS SNG · geanimeerde positie</span><span id="railProgressText"><b>${Math.round(rpos)}%</b> zichtbaar traject</span></div></section><section class="drive-vertical"><span class="eyebrow">Baanvak</span><div class="vert-number" id="progressPercent">${sp.available?Math.round(sp.percent)+'%':'—'}</div><div class="vert-graph"><div class="vert-line"></div><div class="vert-fill" id="vertFill"></div><div class="vert-end top"></div><div class="vert-end bottom"></div><div class="vert-train" id="vertTrain" aria-hidden="true">🚆</div></div><div class="vert-caption" id="progressStatus">${escapeHtml(sp.text)}</div></section><section class="drive-commands"><div class="command-head">VOLGENDE HALTE</div><div class="command-stop">${escapeHtml(next?.name||'Rit voltooid')}</div><button class="arrive-large" data-action="arrive" ${!next?'disabled':''}>✓ Aangekomen<span>${next?'Bevestig deze halte':'Eindstation bereikt'}</span></button><div class="command-mini"><button class="btn-soft" data-action="back" ${pos===0?'disabled':''}>← Vorige</button><button class="btn-soft" data-action="pause">${run.paused?'▶ Verder':'Ⅱ Pauze'}</button></div></section></div><div class="drive-bottom"><section class="drive-next"><div class="next-info"><div class="eyebrow">${next?'VOLGENDE STATION':'EINDSTATION'}</div><div class="next-location">${escapeHtml(next?.name||stops[pos].name)}</div><div class="next-kv"><div><span>Vertrek</span><strong>${escapeHtml(stops[pos].departure||'—:—:—')}</strong></div><div><span>Aankomst</span><strong>${escapeHtml(next?.arrival||'—:—:—')}</strong></div></div></div><div class="timer-panel"><div class="eyebrow">RESTERENDE TIJD</div><div class="drive-count ${c.late?'late':''}" id="countdown">${c.value}</div><div class="drive-count-sub" id="countStatus">${escapeHtml(c.text)}</div></div></section><section class="drive-upcoming"><div class="up-head"><strong>Komende stations</strong><span>Maximaal 3</span></div><div class="compact-stops">${compactUpcoming()}</div></section></div><div class="drive-settings"><span class="setting-caption">Spelklok synchroniseren:</span><input aria-label="Speltijd in uren, minuten en seconden" id="syncClock" type="time" step="1" value="${run.plan.base===null?'':clock(run.plan.base+elapsed())}"><button class="btn-blue" data-action="sync">Sync</button><span class="game-label">Huidige spelklok</span><span class="game-time" id="gameClock">${run.plan.base===null?'—:—:—':clock(run.plan.base+elapsed())}</span></div><div class="drive-foot">De animatie volgt je opgegeven tijden; de positie wordt bij ‘Aangekomen’ bevestigd. Er is geen automatische koppeling met TSW.</div></section>`;}
function render(){ensure();document.body.classList.toggle('is-driving',mode==='run'&&!!run);$('#app').innerHTML=`<div class="app">${mode==='run'&&run?runView():setup()}</div>`;if(run&&mode==='run')updateClock();}
function refresh(){save();render();}

function updateTrainMarker(el,pct){if(!el)return;let track=el.parentElement;let line=track.querySelector('.overview-line');if(!line){el.style.left=pct+'%';return;}let left=line.offsetLeft,right=track.clientWidth-(line.offsetLeft+line.offsetWidth);let px=left+(line.offsetWidth*(pct/100));el.style.left=px+'px';}
function updateClock(){if(mode!=='run'||!run)return;let c=count(),sp=segmentProg(),progress=sp.available?sp.percent:0,elem=$('#countdown');if(elem){elem.textContent=c.value;elem.classList.toggle('late',c.late);}let stat=$('#countStatus');if(stat)stat.textContent=c.text;let clk=$('#gameClock');if(clk)clk.textContent=run.plan.base===null?'—:—:—':clock(run.plan.base+elapsed());let p=$('#progressPercent');if(p)p.textContent=sp.available?Math.round(sp.percent)+'%':'—';let ps=$('#progressStatus');if(ps)ps.textContent=sp.text;let vf=$('#vertFill'),vt=$('#vertTrain');if(vf)vf.style.height='calc((100% - 18px) * '+progress/100+')';if(vt)vt.style.top='calc(9px + (100% - 18px) * '+progress/100+')';let windowPos=railPos(),mark=$('#railMarker'),fill=$('#railFill'),tx=$('#railProgressText'),w=visibleStops();let first=100/(2*w.shown), span=100-2*first;let x=first+span*windowPos/100;if(mark)mark.style.left=x+'%';if(fill)fill.style.width=(span*windowPos/100)+'%';if(tx)tx.innerHTML='<b>'+Math.round(fullRouteProg())+'%</b> van totale rit';}
function addRoute(){let newR={id:newid(),name:'Nieuwe route',segments:[segment('Nieuw segment',['Vertrekstation','Eindstation'])]};routes.push(newR);routeId=newR.id;segmentId=newR.segments[0].id;phase='segments';clearTimes();refresh();$('#routeName')?.focus();}
function addSegment(){let ss=segment('Nieuw segment',['Vertrekstation','Eindstation']);r().segments.push(ss);segmentId=ss.id;phase='segments';clearTimes();refresh();$('#segmentName')?.focus();}
function start(){let st=currentTimes();if(st.length<2||st.some(p=>!p.name.trim()))return notify('Vul eerst minimaal twee stations met namen in.');let p=plan(st);if(p.error)return notify(p.error);run={routeName:r().name,segmentName:s().name,stops:st,plan:p,index:0,baseElapsed:0,anchor:Date.now(),paused:false};mode='run';render();if(p.base===null)notify('Rit gestart zonder countdown. Vul volgende keer tijden in.');}
function finish(){run=null;mode='setup';phase='times';clearTimes();render();notify('Rit afgesloten. Je segment is bewaard; tijden zijn gewist.');}
function sync(){let v=mm($('#syncClock')?.value),base=run.plan.base;if(v===null)return notify('Vul een geldige speltijd in.');if(base===null)return notify('Er is geen beginvertrektijd ingevuld.');let raw=v-base,cur=elapsed();while(raw-cur>43200)raw-=86400;while(cur-raw>43200)raw+=86400;run.baseElapsed=raw;run.anchor=Date.now();render();notify('Spelklok bijgewerkt.');}
function exportData(){let blob=new Blob([JSON.stringify({format:'TSW RouteRegie',version:2,routes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tsw-segmenten-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function importData(f){if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.routes)||!data.routes.length)throw Error('No routes');if(!confirm('Wil je bestaande routes vervangen door de routes in deze back-up?'))return;routes=data.routes.map(clean).filter(Boolean);if(!routes.length)throw Error('Empty');routeId=routes[0].id;segmentId=routes[0].segments[0]?.id;clearTimes();phase='segments';refresh();notify('Segmenten geïmporteerd.');}catch(e){notify('Ongeldige back-up.');}};reader.readAsText(f);}
$('#app').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id,rr=r(),ss=s();if(a==='addRoute')return addRoute();if(a==='addSegment')return addSegment();if(a==='deleteRoute'){if(!confirm('Route inclusief segmenten verwijderen?'))return;routes=routes.filter(x=>x.id!==rr.id);ensure();clearTimes();return refresh();}if(a==='deleteSegment'){if(!confirm('Dit segment verwijderen?'))return;rr.segments=rr.segments.filter(x=>x.id!==ss.id);segmentId=rr.segments[0]?.id;ensure();clearTimes();return refresh();}if(a==='reverse'){let x=segment(ss.name+' (terug)',[...ss.stops].reverse().map(p=>p.name));rr.segments.push(x);segmentId=x.id;phase='segments';clearTimes();refresh();return notify('Rijrichting toegevoegd en opgeslagen.');}if(a==='addStop'){ss.stops.splice(Math.max(1,ss.stops.length-1),0,stop(''));return refresh();}if(a==='deleteStop'){ss.stops=ss.stops.filter(p=>p.id!==id);delete times[id];return refresh();}if(a==='up'||a==='down'){let i=ss.stops.findIndex(p=>p.id===id),j=i+(a==='up'?-1:1);if(i>=0&&j>=0&&j<ss.stops.length)[ss.stops[i],ss.stops[j]]=[ss.stops[j],ss.stops[i]];return refresh();}if(a==='saveSegment'){save();return notify('Segment en haltes opgeslagen.');}if(a==='tabTimes'){if(ss.stops.some(p=>!p.name.trim()))return notify('Geef eerst ieder station een naam.');phase='times';return render();}if(a==='tabSegments'){phase='segments';return render();}if(a==='clearTimes'){if(!confirm('Tijden voor deze rit wissen? De opgeslagen haltes blijven staan.'))return;clearTimes();render();return;}if(a==='start')return start();if(a==='arrive'){if(run&&run.index<run.stops.length-1){run.index++;render();}return;}if(a==='back'){if(run&&run.index>0){run.index--;render();}return;}if(a==='pause'){if(!run)return;if(!run.paused){run.baseElapsed=elapsed();run.paused=true;}else{run.anchor=Date.now();run.paused=false;}return render();}if(a==='sync')return sync();if(a==='finish')return finish();if(a==='export')return exportData();if(a==='import')return $('#fileImport')?.click();});
$('#app').addEventListener('input',e=>{if(mode!=='setup')return;let x=e.target,ss=s(),row=x.closest('[data-id]');if(x.id==='routeName'){r().name=x.value;save();return;}if(x.id==='segmentName'){ss.name=x.value;save();return;}if(row&&x.dataset.field==='name'){let st=ss.stops.find(p=>p.id===row.dataset.id);if(st){st.name=x.value;save();}return;}if(row&&x.dataset.time){times[row.dataset.id]??={};times[row.dataset.id][x.dataset.time]=x.value;}});
$('#app').addEventListener('change',e=>{let x=e.target;if(x.id==='fileImport')return importData(x.files?.[0]);if(x.id==='routeSelect'){routeId=x.value;segmentId=r().segments[0]?.id;clearTimes();phase='segments';return refresh();}if(x.id==='segmentSelect'){segmentId=x.value;clearTimes();phase='segments';return refresh();}if(x.id==='routeName'||x.id==='segmentName'){let current=x.id==='routeName'?r():s();current.name=x.value;return refresh();}});
ensure();save();render();setInterval(updateClock,250);
})();
</script>
