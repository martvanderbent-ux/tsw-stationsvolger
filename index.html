/* RouteRegie Premium — dashboard ontworpen voor de iPad */
body.is-driving{overflow-x:hidden}
body.is-driving .app{max-width:1480px;padding:12px 18px 18px}
body.is-driving .top{margin:0 0 10px}
body.is-driving .logo{width:37px;height:37px;border-radius:11px;font-size:18px}
body.is-driving .brand h1{font-size:17px}
body.is-driving .brand p{font-size:10px}
.drive-screen{width:100%;min-width:0}
.drive-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.drive-title{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.drive-title h2{margin:0;font-size:clamp(17px,2vw,23px);font-weight:850;letter-spacing:-.035em}
.drive-title small{color:#a5bbcf;font-size:11px}
.drive-head .btn-ghost{white-space:nowrap;min-height:32px;padding:6px 10px;font-size:11px}
.drive-main{display:grid;grid-template-columns:minmax(0,1fr) 145px 210px;gap:12px;align-items:stretch}
.drive-rail,.drive-vertical,.drive-commands,.drive-next,.drive-upcoming,.drive-settings{border:1px solid #29465e;background:linear-gradient(145deg,#11263b,#101e31);border-radius:17px;min-width:0;box-shadow:0 10px 27px #0003}
.drive-rail{padding:15px 14px 10px;background:radial-gradient(circle at 76% 0%,#1a405a 0,transparent 43%),linear-gradient(150deg,#122b40,#0c1d31)}
.drive-rail-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.drive-rail-head strong{font-size:14px;letter-spacing:.015em}
.drive-rail-head .rail-count{font-size:11px;color:#b6cede;white-space:nowrap}
.rail-window{margin-top:6px;min-height:149px;position:relative;overflow:hidden}
.rail-track{position:relative;height:141px;--station-count:5}
.rail-track::before{content:"";position:absolute;left:calc(50% / var(--station-count));right:calc(50% / var(--station-count));top:57px;height:5px;border-radius:12px;background:#36536b}
.rail-fill{position:absolute;left:calc(50% / var(--station-count));top:57px;height:5px;border-radius:12px;background:linear-gradient(90deg,#59dfb2,#56b9f5);width:0;transition:width .5s linear}
.rail-nodes{display:grid;grid-template-columns:repeat(var(--station-count),minmax(0,1fr));height:100%;position:relative;z-index:2}
.rail-node{position:relative;min-width:0;text-align:center;padding:0 5px}
.rail-dot{display:block;width:16px;height:16px;border-radius:50%;position:absolute;top:51.5px;left:50%;transform:translate(-50%,-50%);background:#142b42;border:3px solid #66839d;box-shadow:0 0 0 3px #102437;z-index:3}
.rail-node.is-done .rail-dot{background:#58e0b2;border-color:#3b9584}
.rail-node.is-here .rail-dot{background:#ffd579;border-color:#b8965b;box-shadow:0 0 0 5px #ffcc7521}
.rail-node.is-next .rail-dot{background:#53b7ff;border-color:#8bd4ff;box-shadow:0 0 0 5px #53b7ff22}
.rail-labels{position:absolute;top:77px;left:0;right:0;display:flex;flex-direction:column;gap:4px;align-items:center}

/* RouteRegie 3.1 — optionele baanvakafstanden, bewust compact op iPad */
.distance-field{min-width:0}
.distance-start{font-size:12px;color:#789bb1;display:block;padding-left:3px}
.distance-input-wrap{display:flex;align-items:center;gap:7px;width:100%}
.distance-input-wrap input{min-width:0;width:100%;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;padding:9px 7px}
.distance-input-wrap span{font-size:12px;color:#94b5c8;flex:none}
.distance-field .time-label{display:block;color:#a9c9d9;font-size:10px;margin-bottom:5px;letter-spacing:.025em}
.drive-next .next-kv{gap:12px 20px;align-items:start}
.drive-next .next-kv .distance-ride{min-width:138px;flex:1 1 145px;border-left:1px solid #34566b;padding-left:13px}
.distance-ride strong{display:block;font-size:clamp(22px,2.8vw,28px)!important;letter-spacing:-.035em;color:#78e7c6;line-height:1.1}
.distance-ride small{display:block;font-size:10px;line-height:1.3;margin-top:5px;color:#a4c5d4;max-width:240px}

/* Automatische geografische stationsafstanden — iPad compact */

.geo-details{font-size:11px;color:#a0c7cf;line-height:1.5}

.geo-method.manual{color:#c8dcf0}.geo-method.auto{color:#8be5c2}
.distance-field input[data-field=distanceKm]:focus{outline-color:#46cda7}
@media(max-width:900px){.geo-tools{padding:11px}.geo-tools-top{align-items:flex-start}}

<script>
(()=>{'use strict';
const KEY='tsw_routeregie_segments_v2', OLD='tsw_routeregie_v1';

const TRACK_STORIES=[
 {from:'brighton',to:'london road',kind:'Viaduct',title:'Het viaduct bij Brighton',body:'Op dit baanvak ligt het historische Brighton Railway Viaduct. Tijdens de Tweede Wereldoorlog werd in mei 1943 een pijler beschadigd door een Duitse bom; de treinen konden binnen ongeveer een maand weer rijden.',source:'My Brighton and Hove',url:'https://www.mybrightonandhove.org.uk/topics/topictrans/railways/railways-6'},
 {from:'london road',to:'moulsecoomb',kind:'Tunnel en viaduct',title:'Korte tunnels en het Hodshrove-viaduct',body:'Rond dit deel van de lijn liggen de korte Ditchling Road Tunnel (63 yards) en het Hodshrove Viaduct bij Moulsecoomb. Het viaduct is ongeveer 55 meter lang en 14 meter hoog.',source:'My Brighton and Hove',url:'https://www.mybrightonandhove.org.uk/topics/topictrans/railways/railways-6'},
 {from:'moulsecoomb',to:'falmer',kind:'Tunnel',title:'De Falmer Tunnel',body:'De spoorlijn duikt bij Falmer door een tunnel van ongeveer 495 yards (452 meter). De tunnel hoort bij het historische traject richting Lewes.',source:'My Brighton and Hove',url:'https://www.mybrightonandhove.org.uk/topics/topictrans/railways/railways-6'},
 {from:'falmer',to:'lewes',kind:'Tunnel',title:'Kingston Tunnel onder Juggs Road',body:'Op het traject richting Lewes ligt Kingston Tunnel, een korte tunnel van 103 yards bij Southover. De nabijgelegen oude routeverbindingen vertellen het verhaal van Lewes als spoorwegknooppunt.',source:'My Brighton and Hove',url:'https://www.mybrightonandhove.org.uk/topics/topictrans/railways/railways-6'},
 {from:'lewes',to:'southease',kind:'Spoorweggeschiedenis',title:'De aftakking bij Southerham Junction',body:'Ten zuiden van Lewes splitst de Seaford-tak zich bij Southerham Junction af van de East Coastway-lijn. De verbinding naar Newhaven opende al in 1847; de verlenging naar Seaford volgde in 1864.',source:'Network Rail',url:'https://www.networkrailmediacentre.co.uk/news/passengers-welcomed-back-on-the-lewes-to-seaford-line-in-east-sussex-after-four-days-of-successful-network-rail-improvement-work'},
 {from:'southease',to:'newhaven town',kind:'Landschap',title:'De Ousevallei en de oude draaibrug',body:'De trein volgt hier het gebied rond de rivier de Ouse. Bij Southease staat een historische draaibrug uit 1880 die ooit scheepvaart met masten doorgang gaf; de brug is sinds 1988 vastgezet.',source:'Historic England',url:'https://historicengland.org.uk/listing/the-list/list-entry/1393389'},
 {from:'newhaven town',to:'newhaven harbour',kind:'Havengeschiedenis',title:'Een spoorlijn voor de haven',body:'De spoorlijn naar Newhaven werd in 1847 aangelegd om het vervoer naar en van de haven mogelijk te maken. Later kwamen er grote opstelsporen bij de dokken en verbindingen met de veerdiensten.',source:'Network Rail',url:'https://www.networkrailmediacentre.co.uk/news/passengers-welcomed-back-on-the-lewes-to-seaford-line-in-east-sussex-after-four-days-of-successful-network-rail-improvement-work'},
 {from:'newhaven harbour',to:'bishopstone',kind:'Spoortechniek',title:'Een bijzonder enkelsporig traject',body:'Het gedeelte tussen Newhaven Harbour en Seaford werd in 1975 enkelsporig gemaakt om kosten te besparen. Het is daarmee een opvallend voorbeeld van een geëlektrificeerde enkelsporige lijn met derde rail.',source:'Network Rail',url:'https://www.networkrailmediacentre.co.uk/news/passengers-welcomed-back-on-the-lewes-to-seaford-line-in-east-sussex-after-four-days-of-successful-network-rail-improvement-work'},
 {from:'bishopstone',to:'seaford',kind:'Spoorweggeschiedenis',title:'De verlenging naar Seaford',body:'Het oorspronkelijke baanvak liep vanaf 1847 tot Newhaven. In 1864 werd de spoorlijn verlengd naar de badplaats Seaford. Elektrificatie van de tak volgde in 1935.',source:'Network Rail',url:'https://www.networkrailmediacentre.co.uk/news/passengers-welcomed-back-on-the-lewes-to-seaford-line-in-east-sussex-after-four-days-of-successful-network-rail-improvement-work'},
 {from:'polegate',to:'hampden park',kind:'Verdwenen spoorlijnen',title:'Polegate als voormalig spoorwegknooppunt',body:'Polegate had vroeger ook een verbinding naar Hailsham en verder via de Cuckoo Line. De sporen en het emplacement veranderden verschillende keren, terwijl het station nu vooral de kustlijn bedient.',source:'East Coastway-lijngeschiedenis',url:'https://en.wikipedia.org/wiki/Polegate_railway_station'}
];
const STATION_NOTES_KEY='tsw_routeregie_station_notes_v1';
const STATION_STORIES={"brighton":{"heading":"Een Victoriaans spoorwegmonument","history":"Brighton opende in 1840 voor de spoorlijn naar Shoreham. Het stationsgebouw voor de lijn uit Londen werd in 1841 voltooid naar ontwerp van David Mocatta.","detail":"De indrukwekkende gebogen kap van ijzer en glas dateert uit 1882–1883. Het station en de overkapping zijn beschermd als Grade II*-monument.","source":"Historic England","url":"https://historicengland.org.uk/listing/the-list/list-entry/1380797"},"london road":{"heading":"Een station dat niet aan London Road ligt","history":"London Road (Brighton) opende op 1 oktober 1877 als tussenstation aan de tak tussen Brighton en Lewes.","detail":"Ondanks de naam ligt het station niet rechtstreeks aan London Road. Dat zorgt nog weleens voor verwarring met de stationsnaam in Guildford.","source":"Wikipedia · London Road (Brighton)","url":"https://en.wikipedia.org/wiki/London_Road_(Brighton)_railway_station"},"london road brighton":{"heading":"Een station dat niet aan London Road ligt","history":"London Road (Brighton) opende op 1 oktober 1877 als tussenstation aan de tak tussen Brighton en Lewes.","detail":"Ondanks de naam ligt het station niet rechtstreeks aan London Road. Dat zorgt nog weleens voor verwarring met de stationsnaam in Guildford.","source":"Wikipedia · London Road (Brighton)","url":"https://en.wikipedia.org/wiki/London_Road_(Brighton)_railway_station"},"moulsecoomb":{"heading":"Een opvallend jong station","history":"Moulsecoomb opende pas in mei 1980. Het is daarmee veel jonger dan de meeste stations op deze spoorlijn.","detail":"Het station ligt direct naast de campus Moulsecoomb van de University of Brighton en bedient ook de wijk Hollingdean.","source":"Wikipedia · Moulsecoomb","url":"https://en.wikipedia.org/wiki/Moulsecoomb_railway_station"},"falmer":{"heading":"Universiteiten en voetbal aan het spoor","history":"Het eerste station bij Falmer opende in 1846. In 1865 verhuisde de halte naar een andere locatie en in 1890 volgde een herbouw.","detail":"Falmer bedient twee universitaire campussen én het Falmer Stadium, de thuisbasis van Brighton & Hove Albion.","source":"Wikipedia · Falmer","url":"https://en.wikipedia.org/wiki/Falmer_railway_station"},"lewes":{"heading":"Een station dat meerdere keren veranderde","history":"Het eerste station van Lewes opende in 1846. De spoorligging was onhandig voor doorgaande treinen, die aanvankelijk soms moesten keren.","detail":"In 1857 kwam er een nieuw station; de huidige stationsindeling ontstond grotendeels bij een herbouw in 1889.","source":"Friends of Lewes · Railways at Lewes","url":"https://friends-of-lewes.org.uk/resources/publications/railways-at-lewes-by-robert-cheesman/"},"southease":{"heading":"Een landelijke halte bij de South Downs","history":"Dit station opende in 1906 onder de naam Southease and Rodmell Halt. Sinds 1980 heet het simpelweg Southease.","detail":"De South Downs Way kruist hier de spoorlijn, tussen akkers en het dal van de rivier de Ouse.","source":"Wikipedia · Southease","url":"https://en.wikipedia.org/wiki/Southease_railway_station"},"newhaven town":{"heading":"De toegang tot de veerhaven","history":"Newhaven groeide uit tot een belangrijke havenplaats met een spoorverbinding naar het Kanaalverkeer.","detail":"Wie vandaag naar de veerboot richting Dieppe in Frankrijk wil, wordt door National Rail naar Newhaven Town verwezen, niet naar Newhaven Harbour.","source":"National Rail · Newhaven Harbour","url":"https://www.nationalrail.co.uk/stations/newhaven-harbour/"},"newhaven harbour":{"heading":"De oude verbinding met de veerhaven","history":"Newhaven Harbour ligt bij de haven en het goederenvervoer van Newhaven. Vroeger speelde de spoorlijn hier een rol bij de overtocht naar Frankrijk.","detail":"De moderne passagiersveerterminal ligt niet meer bij dit station. National Rail verwijst reizigers naar Newhaven Town.","source":"National Rail · Newhaven Harbour","url":"https://www.nationalrail.co.uk/stations/newhaven-harbour/"},"newhaven marine":{"heading":"Het verdwenen bootstation","history":"Newhaven Marine opende in 1886 voor treinen die aansluiting boden op boten naar het Franse Dieppe.","detail":"De passagiersdienst stopte in 2006; het station werd in 2020 officieel gesloten. In TSW kun je dus een historisch spoorverhaal tegenkomen.","source":"GOV.UK · Newhaven Marine","url":"https://www.gov.uk/government/consultations/newhaven-marine-rail-station-closure/newhaven-marine-station-closure"},"bishopstone":{"heading":"Art-deco-architectuur aan zee","history":"Het huidige Bishopstone-station opende in 1938 en heeft een opvallend art-deco-ontwerp.","detail":"Het stationsgebouw kreeg een achthoekige centrale hal. De geplande woonwijk rond het station werd nooit in de oorspronkelijke vorm ontwikkeld.","source":"Wikipedia · Bishopstone","url":"https://en.wikipedia.org/wiki/Bishopstone_railway_station"},"seaford":{"heading":"Eindpunt van de kusttak","history":"Seaford kreeg op 1 juni 1864 een station aan de aftakking van East Coastway.","detail":"Er is nog maar één perron in gebruik. Het oude perron 1 is nog herkenbaar, maar de spoorrails daarvan zijn verwijderd.","source":"Wikipedia · Seaford","url":"https://en.wikipedia.org/wiki/Seaford_railway_station_%28England%29"},"eastbourne":{"heading":"Een station uit de badplaatsgeschiedenis","history":"Het eerste Eastbourne-station dateert van 1849, toen de kustplaats zich sterk begon te ontwikkelen.","detail":"Het huidige stationsgebouw uit 1886 heeft een opvallende daklantaarn en een klokkentoren; het ontwerp weerspiegelt de grandeur van een Victoriaanse badplaats.","source":"National Transport Trust · Eastbourne","url":"https://www.nationaltransporttrust.org.uk/heritage-sites/heritage-detail/eastbourne-station"},"glynde":{"heading":"Een spoorweg uit de begintijd","history":"Glynde station opende in 1846 aan de verbinding van Lewes richting Hastings.","detail":"De spoorlijn was aanvankelijk enkelsporig en werd al in 1847 verdubbeld.","source":"Wikipedia · Glynde","url":"https://en.wikipedia.org/wiki/Glynde_railway_station"}};

const $=s=>document.querySelector(s), newid=()=>('id'+Math.random().toString(36).slice(2,11));
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stop=(name,distanceKm=null)=>({id:newid(),name,distanceKm:parseDistance(distanceKm),distanceKind:parseDistance(distanceKm)!==null?'manual':null,latitude:null,longitude:null,geoLabel:''});
const segment=(name,names)=>({id:newid(),name,stops:names.map(name=>stop(name)),trackFacts:[]});
const example=()=>({id:newid(),name:'East Coastway',segments:[segment('Brighton → Lewes',['Brighton','London Road','Moulsecoomb','Falmer','Lewes']),segment('Lewes → Brighton',['Lewes','Falmer','Moulsecoomb','London Road','Brighton'])]});
let routes=[example()],routeId=routes[0].id,segmentId=routes[0].segments[0].id,phase='segments',mode='setup',times={},lastPickedTime='',activeTimePicker=null,run=null,toastTimer;
let stationInfoOpen=false,stationInfoIndex=0,stationNotes={};
let trackInfoOpen=false,trackInfoIndex=0,trackEditId=null;
let importSummary='';
try{let value=JSON.parse(localStorage.getItem(STATION_NOTES_KEY)||'{}');if(value&&typeof value==='object'&&!Array.isArray(value))stationNotes=value;}catch(e){}
function clean(raw){if(!raw||typeof raw!=='object')return null;return {id:String(raw.id||newid()),name:String(raw.name||'Route'),segments:(Array.isArray(raw.segments)?raw.segments:[]).slice(0,150).map(x=>({id:String(x.id||newid()),name:String(x.name||'Segment'),stops:(Array.isArray(x.stops)?x.stops:[]).slice(0,120).map((y,i)=>({id:String(y.id||newid()),name:String(y.name||'Station'),distanceKm:i===0?null:parseDistance(y.distanceKm),distanceKind:i===0?null:(parseDistance(y.distanceKm)===null?null:(y.distanceKind==='air'?'air':y.distanceKind==='rail'?'rail':'manual')),latitude:validCoord(y.latitude,y.longitude)?Number(y.latitude):null,longitude:validCoord(y.latitude,y.longitude)?Number(y.longitude):null,geoLabel:String(y.geoLabel||'').slice(0,220)})),trackFacts:(Array.isArray(x.trackFacts)?x.trackFacts:[]).slice(0,300).map(f=>({id:String(f.id||newid()),fromId:String(f.fromId||''),toId:String(f.toId||''),kind:String(f.kind||'Bijzonderheid').slice(0,70),title:String(f.title||'').slice(0,130),body:String(f.body||'').slice(0,2400),source:String(f.source||'').slice(0,500)})).filter(f=>f.title&&f.body)}))};}
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.routes?.length){routes=saved.routes.map(clean).filter(Boolean);routeId=saved.routeId;segmentId=saved.segmentId;}else{let old=JSON.parse(localStorage.getItem(OLD)||'null');if(old?.routes?.length){routes=old.routes.map(clean).filter(Boolean);routeId=old.selectedRoute;segmentId=old.selectedSegment;}}}catch(e){}
function r(){return routes.find(x=>x.id===routeId)||routes[0]}
function s(){return r()?.segments.find(x=>x.id===segmentId)||r()?.segments[0]}
function ensure(){if(!routes.length)routes=[example()];routeId=r().id;if(!r().segments.length)r().segments=[segment('Nieuw segment',['Vertrekstation','Eindstation'])];segmentId=s().id;}
function save(){for(let rt of routes)for(let seg of rt.segments)applyRailReference(seg,rt.name);try{localStorage.setItem(KEY,JSON.stringify({routes,routeId,segmentId}));}catch(e){notify('Opslaan is niet mogelijk in deze browser. Maak een back-up.');}}
function notify(msg){let e=$('#toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),3300);}
function clearTimes(){times={};lastPickedTime='';closeTimePicker();}
function currentTimes(){return s().stops.map(p=>({id:p.id,name:p.name,arrival:times[p.id]?.arrival||'',departure:times[p.id]?.departure||'',distanceKm:p.distanceKm??null,distanceKind:p.distanceKind||null}));}
function parseDistance(v){if(v===null||v===undefined||String(v).trim()==='')return null;let number=Number(String(v).trim().replace(',','.'));return Number.isFinite(number)&&number>0&&number<=10000?Math.round(number*1000)/1000:null;}
const formatKm=km=>new Intl.NumberFormat('nl-NL',{maximumFractionDigits:2}).format(km);
const formatRemainingKm=km=>km>0&&km<0.1?'< 0,1 km':new Intl.NumberFormat('nl-NL',{minimumFractionDigits:1,maximumFractionDigits:1}).format(km)+' km';
function distanceInfo(sp){if(!run)return {value:'— km',hint:'Geen rit actief'};if(run.index>=run.stops.length-1)return {value:'0,0 km',hint:'Eindstation bereikt'};let km=parseDistance(run.stops[run.index+1]?.distanceKm);if(km===null)return {value:'— km',hint:geoBusy?'Stations worden opgezocht…':'Nog geen afstand: gebruik Automatisch opzoeken bij Segment beheren'};let kind=run.stops[run.index+1]?.distanceKind;let method=kind==='rail'?'spoorafstand (referentiewaarde)':kind==='air'?'hemelsbreed (geen spoorafstand)':'handmatig ingevulde baanvakafstand';if(sp?.available)return {value:formatRemainingKm(Math.max(0,km*(1-sp.percent/100))),hint:'Schatting uit rijtijd · '+method+' '+formatKm(km)+' km'};return {value:formatKm(km)+' km',hint:'Totale afstand · '+method};}
function mm(v){let m=/^([01]\d|2[0-3]):([0-5]\d)(?::([0-5]\d))?$/.exec((v||'').trim());return m?(+m[1])*3600+(+m[2])*60+(+(m[3]||0)):null;}
const clock=s=>{s=((Math.floor(s)%86400)+86400)%86400;return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const duration=v=>{v=Math.abs(Math.ceil(v));let h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=v%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');};
function plan(stops){let start=mm(stops[0]?.departure);if(start===null)return {base:null,stops:stops.map(()=>({arrival:null,departure:null})),error:null};let last=start,output=[];for(let i=0;i<stops.length;i++){let row={arrival:null,departure:null};for(let type of (i===0?['departure']:['arrival','departure'])){let x=mm(stops[i][type]);if(x===null)continue;let val=Math.floor(last/86400)*86400+x;if(val<last){if(last-val>43200)val+=86400;else return {base:start,stops:output,error:'Een tijd bij '+stops[i].name+' is eerder dan de vorige tijd.'};}row[type]=(val-start);last=val;}output.push(row);}return {base:start,stops:output,error:null};}
function header(){return `<header class="top"><div class="brand"><div class="logo">↗</div><div><h1>TSW RouteRegie</h1><p>RouteRegie 3.3 · iPad Premium · spoorafstanden East Coastway</p></div></div><span class="tag">● SAFARI · PREMIUM</span></header>`;}
function toolbar(){return `<div class="button-row"><button class="btn-soft btn-small" data-action="export">↓ Back-up</button><button class="btn-soft btn-small" data-action="import">↑ Back-up herstellen</button><input hidden id="fileImport" type="file" accept=".json,application/json"></div><div class="import-divider"></div><h3 class="section-title">04 / Routes toevoegen</h3><p class="import-hint">Voeg <strong>CSV of JSON</strong> toe vanuit de Bestanden-app. Je huidige routes blijven bewaard.</p><button class="import-add-btn" data-action="appendImport">＋ Routes toevoegen (.csv / .json)</button><input hidden id="fileAppendImport" type="file" accept=".csv,.json,text/csv,text/plain,application/json"><div class="download-pair"><button type="button" data-action="sampleCsv">↓ Voorbeeld CSV</button><button type="button" data-action="sampleJson">↓ Voorbeeld JSON</button></div>${importSummary?`<div class="import-summary" role="status">${escapeHtml(importSummary)}</div>`:''}`;}
// OSM Nominatim: deliberately limited, on-demand station lookup only (never autocomplete).
// This is a personal rail-route app, not a generic geocoding interface.
// Policy: max one request every 1.4 s, 8 new station names per user action, cache all results,
// explicit attribution and no periodic automatic or systematic global data collection.
// A configurable endpoint allows changing provider without editing this file.
const GEO_CONFIG_KEY='tsw_route_geo_config_v1';
const GEO_CACHE_KEY='tsw_routeregie_station_geocache_v1';
let geoBusy=false,geoStatus='',geoLastAt=0,geoCache={};
try{let o=JSON.parse(localStorage.getItem(GEO_CACHE_KEY)||'{}');if(o&&typeof o==='object'&&!Array.isArray(o))geoCache=o;}catch(e){}
function validCoord(lat,lon){return Number.isFinite(Number(lat))&&Number.isFinite(Number(lon))&&lat!==null&&lon!==null&&lat!==''&&lon!==''&&Number(lat)>=-90&&Number(lat)<=90&&Number(lon)>=-180&&Number(lon)<=180;}
function geoKey(name,routeName){return String(routeName||'').toLowerCase().trim()+'|'+String(name||'').toLowerCase().replace(/\s+/g,' ').trim();}
function geoCountry(routeName){let s=String(routeName||'').toLowerCase();if(/east coastway|southern|brighton|seaford|london|southeastern|west coast main|great western|thameslink|northern trans|uk|england|scotland|wales/.test(s))return 'gb';if(/veluwelijn|nederlan|holland|sprinter|utrecht|amersfoort|randstad|ns\b/.test(s))return 'nl';if(/s-bahn|deutsch|german|berlin|hamburg|munich|münchen|köln|ruhr|dresden/.test(s))return 'de';if(/northeast corridor|caltrain|usa|new york|new jersey|boston/.test(s))return 'us';return '';}
function geoQuery(name,route){let n=String(name||'').trim(),hint=geoCountry(route);if(hint==='gb'){if(/^london road$/i.test(n))n='London Road Brighton';if(/^brighton$/i.test(n))n='Brighton England';return n+' railway station'+(n.toLowerCase().includes('brighton')?'':', England');}if(hint==='nl')return n+' treinstation Nederland';if(hint==='de')return n+' Bahnhof Deutschland';if(hint==='us')return n+' train station United States';return n+' railway station';}

ect></div><div><label for="mergeSecond">Tweede segment</label><select id="mergeSecond">${rr.segments.map(x=>`<option value="${escapeHtml(x.id)}" ${x.id!==ss.id&&rr.segments.filter(z=>z.id!==ss.id)[0]?.id===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></div></div><button class="btn-blue quick-cta" data-action="mergeSegments" ${rr.segments.length<2?'disabled':''}>＋ Samengevoegd segment opslaan</button></div></details></div><div class="segment-actions"><button class="btn-blue" data-action="addStop">+ Tussenstation toevoegen</button><button class="btn-soft" data-action="saveSegment">✓ Segment opslaan</button><button class="setup-track-button" data-action="openTrackInfo">🛤️ Bijzonderheden onderweg beheren</button></div><div class="segment-help">✓ Stationnamen en kilometers worden automatisch opgeslagen. De <b>geschatte resterende afstand</b> volgt je rijtijd; het is geen live GPS-meting in TSW. Automatisch gevonden waarden zijn hemelsbreed, dus niet de exacte spoorafstand. Je kunt ze altijd vervangen door de spoorafstand.</div><div class="bottom-actions"><span class="muted small">${escapeHtml(ss.stops[0]?.name)} → ${escapeHtml(ss.stops.at(-1)?.name)}</span><button class="btn-primary" data-action="tabTimes">Verder → Tijden instellen</button></div>`:`<div class="ed-head"><div><div class="phase-label">Tijdelijke ritgegevens</div><h2>${escapeHtml(ss.name)}</h2><p class="muted">Vul nu alleen de tijden voor de rit die je gaat spelen in. Je stations blijven intact en de tijden worden <strong>niet</strong> in het segment opgeslagen. Je kunt nu werken met <strong>uren, minuten én seconden</strong>.</p></div><span class="pill">${ss.stops.length} stations</span></div><div class="summaryline"><span>${escapeHtml(ss.stops[0]?.name)} → ${escapeHtml(ss.stops.at(-1)?.name)}</span><button class="btn-ghost btn-small" data-action="clearTimes">↺ Tijden wissen</button></div><div class="run-editor">${timingRows()}</div><div class="time-entry-note">🕒 <b>Tijden met seconden:</b> tik op <b>Tijd kiezen</b> om uren, minuten en seconden apart te selecteren. Bij de volgende halte begint de keuze automatisch bij je laatst ingevulde tijd. Je kunt ook steeds <b>Opslaan &amp; volgende tijd</b> gebruiken.</div><p class="helper-note">Vul bij het beginstation de vertrektijd in en bij volgende stations de aankomsttijd. Vertrektijden bij tussenhaltes zijn optioneel. Gebruik bij voorkeur het formaat <strong>uu:mm:ss</strong>. Zonder tijden kun je de stationsvolger ook handmatig gebruiken, maar dan is er geen countdown. Rit over middernacht wordt ondersteund.</p>${p.error?`<div class="notice warn">⚠ ${escapeHtml(p.error)}</div>`:`<div class="notice">ⓘ Start zodra je in het spel vertrekt. De countdown en treinanimatie volgen je ingevulde tijden tot op de seconde; gebruik Sync om de klok handmatig gelijk te zetten.</div>`}<div class="bottom-actions"><button class="btn-soft" data-action="tabSegments">← Haltes bekijken</button><button class="btn-primary start-btn" data-action="start" ${p.error?'disabled':''}>▶ Start rit</button></div>`}</main></div><div class="footer">Opslag van segmenten is lokaal in deze browser. Gebruik Back-up bij wisselen van apparaat of websiteadres.</div>`;}
function elapsed(){return run.baseElapsed+(run.paused?0:(Date.now()-run.anchor)/1000);}
function target(i){let x=run?.plan.stops[i];return x?(x.arrival??x.departure):null;}
function count(){
  if(run.index>=run.stops.length-1)return {value:'—',late:false,phase:'finished',label:'RIT VOLTOOID',text:'Eindstation bereikt'};
  let pos=run.index, cur=run.stops[pos], departure=run.plan.stops[pos]?.departure, e=elapsed();
  if(run.plan.base===null)return {value:'—:—:—',late:false,phase:'untimed',label:'GEEN TIJD INGESTELD',text:'Vul tijden in voor een countdown'};
  // Zodra Aangekomen is bevestigd, wacht de trein op het geplande vertrek van dit station.
  // Gebruik de bestaande spelklok inclusief pauze en handmatige synchronisatie.
  if(departure!==null && departure!==undefined && e<departure){
    return {value:duration(departure-e),late:false,phase:'departure',label:'VERTREK OVER',text:'Vertrek uit '+cur.name+' om '+clock(run.plan.base+departure)+(run.paused?' · Gepauzeerd':'')};
  }
  let arrival=target(pos+1);
  if(arrival===null)return {value:'—:—:—',late:false,phase:'untimed',label:'AANKOMSTTIJD ONBEKEND',text:'Geen aankomsttijd bij de volgende halte'};
  let remaining=arrival-e;
  return {value:duration(remaining),late:remaining<0,phase:'arrival',label:'AANKOMST OVER',text:remaining<0?'Aankomsttijd verstreken':run.paused?'Gepauzeerd':'Tot volgende halte'};
}
function segmentProg(){if(!run)return {available:false,current:'',next:'',percent:0,text:'Geen rit actief'};let pos=run.index,stops=run.stops,current=stops[pos]?.name||'',next=stops[pos+1]?.name||'';if(pos>=stops.length-1)return {available:false,current,next:'',percent:100,text:'Eindstation bereikt'};if(run.plan.base===null)return {available:false,current,next,percent:0,text:'Geen tijden ingevuld'};let curPlan=run.plan.stops[pos]||{},nextPlan=run.plan.stops[pos+1]||{};let startMin=(curPlan.departure??curPlan.arrival);let endMin=(nextPlan.arrival??nextPlan.departure);if(startMin===null||endMin===null||endMin<=startMin)return {available:false,current,next,percent:0,text:'Onvoldoende tijden voor animatie'};let total=(endMin-startMin),done=elapsed()-startMin,pct=Math.max(0,Math.min(1,done/total));let remain=Math.max(0,total-done);return {available:true,current,next,percent:pct*100,text:run.paused?'Trein gepauzeerd':(done<0?'Wachten op vertrek':(done>total?'Aankomsttijd bereikt':'Nog '+duration(remain)+' tot '+next))};}
function fullRouteProg(){if(!run)return 0;let segments=Math.max(1,run.stops.length-1),base=(run.index/segments)*100,sp=segmentProg();if(sp.available)return Math.max(0,Math.min(100,base+(sp.percent/segments)));return base;}
function sngTrainSVG(){return `<svg viewBox="0 0 180 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="sngBody" x1="0" x2="1"><stop offset="0" stop-color="#ffde3b"/><stop offset="1" stop-color="#ffc500"/></linearGradient><linearGradient id="sngBlue" x1="0" x2="1"><stop offset="0" stop-color="#1b75d1"/><stop offset="1" stop-color="#0f56a6"/></linearGradient></defs><rect x="18" y="18" width="126" height="34" rx="13" fill="url(#sngBody)" stroke="#f7f1c0" stroke-width="2"/><path d="M144 22c12 4 20 12 22 22-1 10-8 15-20 15h-26V22z" fill="url(#sngBlue)"/><path d="M22 48h128l-8 12H34c-7 0-12-3-12-8z" fill="url(#sngBlue)" opacity=".95"/><rect x="34" y="25" width="20" height="11" rx="3" fill="#173957"/><rect x="58" y="25" width="20" height="11" rx="3" fill="#173957"/><rect x="82" y="25" width="20" height="11" rx="3" fill="#173957"/><rect x="106" y="25" width="20" height="11" rx="3" fill="#173957"/><path d="M130 24h9c8 0 13 6 14 12h-23z" fill="#d6efff" opacity=".9"/><circle cx="53" cy="62" r="7" fill="#dcefff"/><circle cx="118" cy="62" r="7" fill="#dcefff"/><circle cx="53" cy="62" r="3" fill="#35536d"/><circle cx="118" cy="62" r="3" fill="#35536d"/><path d="M24 18l-6 7v8" stroke="#d5f0ff" stroke-width="2" opacity=".45"/><path d="M36 17l-7 11M66 17l-7 11M96 17l-7 11" stroke="#fff8cb" stroke-width="2" opacity=".35"/></svg>`;}
function upcomingMarkup(stops,pos){let upcoming=stops.slice(pos+1,pos+4);if(!upcoming.length)return '<div class="premium-note">Geen volgende stations meer. Je bent aan het eind van de rit.</div>';return `<div class="upcoming-list">${upcoming.map((p,idx)=>`<div class="upcoming-item"><div><strong>${escapeHtml(p.name)}</strong><div class="meta">${idx===0?'Volgende halte':idx===1?'Daarna':'Later op de route'}</div></div><div class="time">${escapeHtml(p.arrival||p.departure||'—:—:—')}</div></div>`).join('')}</div>`;}
function visibleStops(){let total=run.stops.length,shown=Math.min(5,total),first=Math.min(Math.max(0,run.index-1),Math.max(0,total-shown));return {first,shown,stops:run.stops.slice(first,first+shown)};}
function railPos(){let w=visibleStops(),den=Math.max(1,w.shown-1),sp=segmentProg(),relative=run.index-w.first+(sp.available?sp.percent/100:0);return Math.max(0,Math.min(100,100*relative/den));}
function compactUpcoming(){let next=run.stops.slice(run.index+1,run.index+4);if(!next.length)return '<div class="compact-stop"><span class="index">✓</span><span class="name">Eindstation bereikt</span><span class="time">—</span></div>';return next.map((p,i)=>`<div class="compact-stop"><span class="index">${i+1}</span><span class="name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span><span class="time">${escapeHtml(p.arrival||p.departure||'—:—:—')}</span></div>`).join('');}

function noteKey(stop){return String(stop?.name||'').trim().toLocaleLowerCase('nl-NL').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');}
function stationStoryFor(stop){let key=noteKey(stop);if(key==='london road'&&!/east coastway|brighton|lewes|falmer/i.test(run?.routeName+' '+run?.segmentName))return null;return STATION_STORIES[key]||null;}
function wikiSearchURL(stop){return 'https://en.wikipedia.org/w/index.php?search='+encodeURIComponent(String(stop?.name||'')+' railway station');}
function renderStationInfo(){let stops=run?.stops||[];if(!stops.length)return '';let idx=Math.min(Math.max(0,stationInfoIndex),stops.length-1);let station=stops[idx],story=stationStoryFor(station),note=stationNotes[noteKey(station)]||'';let heading=stationInfoOpen?'Stationinformatie sluiten':'Ontdek het station';return `<div class="station-info-dock"><button class="station-info-button track-info-button" type="button" data-action="openTrackInfo" aria-label="Bijzonderheden onderweg">🛤️ Onderweg</button><button class="station-info-button" type="button" data-action="openStationInfo" aria-label="${heading}">📖 ${heading}<span class="info-current">${escapeHtml(stops[run.index].name)}</span></button></div>${stationInfoOpen?`<button class="station-info-shade" data-action="closeStationInfo" type="button" aria-label="Sluit stationsinformatie"></button><section class="station-info-sheet" role="dialog" aria-modal="true" aria-label="Stationsverhalen"><header class="station-info-head"><div><div class="station-info-kicker">Stationsverhalen · ${idx+1} van ${stops.length}</div><h3>📍 ${escapeHtml(station.name)}</h3></div><button class="station-info-x" id="stationSheetClose" data-action="closeStationInfo" aria-label="Sluit stationsinformatie">✕</button></header><div class="station-info-body"><div class="station-info-tabs"><button type="button" class="active" data-action="stayStationInfo">📖 Stationsverhalen</button><button type="button" data-action="openTrackInfo">🛤️ Bijzonderheden onderweg</button></div><div class="station-info-controls"><button data-action="infoPrev" ${idx<=0?'disabled':''} aria-label="Vorig station">←</button><select id="infoStationSelect" aria-label="Kies station om over te lezen">${stops.map((p,i)=>`<option value="${i}" ${i===idx?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select><button data-action="infoNext" ${idx>=stops.length-1?'disabled':''} aria-label="Volgend station">→</button></div><article class="station-info-story">${story?`<h4>${escapeHtml(story.heading)}</h4><span class="fact-label">Geschiedenis</span><p>${escapeHtml(story.history)}</p><span class="fact-label">Bijzonder om te weten</span><p>${escapeHtml(story.detail)}</p>`:`<h4>Ontdek ${escapeHtml(station.name)}</h4><p>Voor dit station staat nog geen gecontroleerd verhaal in de app. Je kunt via de zoeklink meer informatie vinden of hieronder je eigen weetjes bewaren.</p>`}<div class="station-info-links">${story?`<a target="_blank" rel="noopener noreferrer" href="${escapeHtml(story.url)}">↗ Bron: ${escapeHtml(story.source)}</a>`:''}<a target="_blank" rel="noopener noreferrer" href="${escapeHtml(wikiSearchURL(station))}">↗ Zoek meer over dit station</a></div></article><div class="station-info-notes"><label for="stationNotesInput">✎ Mijn eigen stationsnotities</label><textarea id="stationNotesInput" maxlength="4000" placeholder="Bijvoorbeeld: bijzonder seinhuis, oude goederenloods, brug of een leuk weetje…">${escapeHtml(note)}</textarea><div class="station-info-note-bottom"><small>Bewaar je eigen weetjes per stationsnaam, op dit apparaat. Je rit en tijden blijven ongewijzigd.</small><button data-action="saveStationNotes">✓ Notitie opslaan</button></div></div></div></section>`:''}`;}
function saveStationNote(){let station=run?.stops?.[stationInfoIndex];if(!station)return;let text=$('#stationNotesInput')?.value||'',key=noteKey(station);if(text.trim())stationNotes[key]=text.trim();else delete stationNotes[key];try{localStorage.setItem(STATION_NOTES_KEY,JSON.stringify(stationNotes));notify('Notitie voor '+station.name+' opgeslagen.');}catch(e){notify('Notitie opslaan mislukt. Controleer browseropslag.');}}
function trackStops(){return mode==='run'&&run?run.stops:s().stops;}
function trackSelectedLeg(){let stations=trackStops();let idx=Math.max(0,Math.min(stations.length-2,trackInfoIndex));return stations.length>1?{from:stations[idx],to:stations[idx+1],idx}:null;}
function knownTrackFacts(from,to){let a=noteKey(from),b=noteKey(to);return TRACK_STORIES.filter(f=>(f.from===a&&f.to===b)||(f.from===b&&f.to===a));}
function customTrackFacts(from,to){return (s().trackFacts||[]).filter(f=>(f.fromId===from.id&&f.toId===to.id)||(f.fromId===to.id&&f.toId===from.id));}
function trackFactCard(f,custom){let source=String(f.source||''),validLink=/^https:\/\/[^\s]+$/i.test(source);return `<article class="track-fact"><div class="track-kicker">${escapeHtml(f.kind||'Bijzonderheid')}${custom?' · Zelf toegevoegd':' · Ingebouwd verhaal'}</div><h4>${escapeHtml(f.title)}</h4><p>${escapeHtml(f.body)}</p>${custom?`<div class="track-fact-tools"><button type="button" class="btn-soft" data-action="editTrackFact" data-id="${escapeHtml(f.id)}">✎ Bewerken</button><button type="button" class="btn-danger" data-action="deleteTrackFact" data-id="${escapeHtml(f.id)}">Verwijder</button></div>${validLink?`<a class="source" target="_blank" rel="noopener noreferrer" href="${escapeHtml(source)}">↗ Eigen bron</a>`:''}`:`<a class="source" target="_blank" rel="noopener noreferrer" href="${escapeHtml(f.url)}">↗ Bron: ${escapeHtml(f.source)}</a>`}</article>`;}
function renderTrackInfo(){if(!trackInfoOpen)return '';let stations=trackStops(),leg=trackSelectedLeg();if(!leg)return '';let idx=leg.idx,total=stations.length-1,from=leg.from,to=leg.to,found=knownTrackFacts(from,to),added=customTrackFacts(from,to),editing=added.find(f=>f.id===trackEditId)||null;return `<button class="station-info-shade" data-action="closeTrackInfo" type="button" aria-label="Sluit bijzonderheden"></button><section class="station-info-sheet" role="dialog" aria-modal="true" aria-label="Bijzonderheden onderweg"><header class="station-info-head"><div><div class="station-info-kicker">Spoorverhalen · baanvak ${idx+1} van ${total}</div><h3>🛤️ ${escapeHtml(from.name)} → ${escapeHtml(to.name)}</h3></div><button class="station-info-x" id="trackSheetClose" data-action="closeTrackInfo" aria-label="Sluit bijzonderheden">✕</button></header><div class="station-info-body"><div class="station-info-tabs"><button type="button" data-action="openStationInfo" ${mode!=='run'?'disabled':''}>📖 Stationsverhalen</button><button type="button" class="active" data-action="stayTrackInfo">🛤️ Bijzonderheden onderweg</button></div><div class="station-info-controls"><button data-action="trackPrev" ${idx===0?'disabled':''} aria-label="Vorig baanvak">←</button><select id="trackLegSelect" aria-label="Kies een baanvak">${stations.slice(0,-1).map((st,i)=>`<option value="${i}" ${idx===i?'selected':''}>${escapeHtml(st.name)} → ${escapeHtml(stations[i+1].name)}</option>`).join('')}</select><button data-action="trackNext" ${idx>=total-1?'disabled':''} aria-label="Volgend baanvak">→</button></div><div class="track-facts">${found.map(f=>trackFactCard(f,false)).join('')}${added.map(f=>trackFactCard(f,true)).join('')}${!found.length&&!added.length?`<article class="track-fact"><div class="track-kicker">Nog te ontdekken</div><h4>Geen ingebouwd verhaal voor dit baanvak</h4><p>Dit betekent niet dat er niets bijzonders ligt. Je kunt hieronder eigen weetjes toevoegen of later meer informatie laten toevoegen. Je opgeslagen segment werkt ook zonder verhalen.</p></article>`:''}</div><div class="track-editor"><h4>${editing?'✎ Je bijzondere plek bewerken':'＋ Zelf een bijzonderheid toevoegen'}</h4><p>Je verhaal wordt aan dit baanvak van het opgeslagen segment gekoppeld. Tijden hoef je hiervoor nooit opnieuw in te vullen.</p><div class="track-editor-grid"><div class="field"><label for="trackFactKind">Soort bijzonderheid</label><select id="trackFactKind">${['Brug','Tunnel','Landschap','Verdwenen spoorlijn','Spoorweggeschiedenis','Gebouw','Anders'].map(kind=>`<option value="${kind}" ${kind===(editing?.kind||'Spoorweggeschiedenis')?'selected':''}>${kind}</option>`).join('')}</select></div><div class="field"><label for="trackFactTitle">Titel</label><input id="trackFactTitle" maxlength="130" placeholder="Bijv. oude spoorbrug" value="${escapeHtml(editing?.title||'')}"></div></div><div class="field"><label for="trackFactBody">Wat is er bijzonder?</label><textarea id="trackFactBody" maxlength="2400" placeholder="Beschrijf wat je hier tijdens het rijden kunt ontdekken…">${escapeHtml(editing?.body||'')}</textarea></div><div class="field"><label for="trackFactSource">Bronlink (optioneel, https://)</label><input id="trackFactSource" inputmode="url" maxlength="500" placeholder="https://…" value="${escapeHtml(editing?.source||'')}"></div><div class="track-editor-actions">${editing?'<button class="btn-soft" data-action="cancelTrackEdit">Annuleren</button>':''}<button class="btn-primary" data-action="saveTrackFact">✓ ${editing?'Wijzigingen bewaren':'Weetje opslaan'}</button></div><div class="track-note">Ook je toekomstige routes en segmenten krijgen dit onderdeel automatisch. Ingebouwde verhalen verschijnen alleen bij bekende baanvakken; eigen verhalen worden per segment opgeslagen en meegenomen in back-ups.</div></div></div></section>`;}
function showTrackInfo(open){if(open){stationInfoOpen=false;trackInfoIndex=mode==='run'&&run?Math.min(run.index,run.stops.length-2):0;trackEditId=null;}trackInfoOpen=open;render();if(open)setTimeout(()=>$('#trackSheetClose')?.focus(),0);}

function importData(f){if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.routes)||!data.routes.length)throw Error('No routes');if(!confirm('Wil je bestaande routes vervangen door de routes in deze back-up?'))return;routes=data.routes.map(clean).filter(Boolean);if(!routes.length)throw Error('Empty');if(data.stationNotes&&typeof data.stationNotes==='object'&&!Array.isArray(data.stationNotes)){stationNotes=data.stationNotes;try{localStorage.setItem(STATION_NOTES_KEY,JSON.stringify(stationNotes));}catch(e){}}routeId=routes[0].id;segmentId=routes[0].segments[0]?.id;clearTimes();phase='segments';refresh();notify('Segmenten geïmporteerd.');}catch(e){notify('Ongeldige back-up.');}};reader.readAsText(f);}
$('#app').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id,rr=r(),ss=s();if(a==='openTimePicker')return openTimePicker(id,b.dataset.time);if(a==='stayTrackInfo'||a==='stayStationInfo')return;if(a==='openTrackInfo')return showTrackInfo(true);if(a==='closeTrackInfo')return showTrackInfo(false);if(a==='trackPrev'){trackInfoIndex=Math.max(0,trackInfoIndex-1);trackEditId=null;return render();}if(a==='trackNext'){trackInfoIndex=Math.min(trackStops().length-2,trackInfoIndex+1);trackEditId=null;return render();}if(a==='saveTrackFact')return saveTrackFact();if(a==='editTrackFact'){trackEditId=id;return render();}if(a==='deleteTrackFact')return deleteTrackFact(id);if(a==='cancelTrackEdit'){trackEditId=null;return render();}if(a==='openStationInfo')return showStationInfo(!stationInfoOpen);if(a==='closeStationInfo')return showStationInfo(false);if(a==='infoPrev'){stationInfoIndex=Math.max(0,stationInfoIndex-1);return render();}if(a==='infoNext'){stationInfoIndex=Math.min(run.stops.length-1,stationInfoIndex+1);return render();}if(a==='saveStationNotes')return saveStationNote();if(a==='lookupDistances')return lookupDistances({onlyMissing:false});if(a==='duplicateSegment')return duplicateSegment();if(a==='bulkSegment')return bulkSegment();if(a==='mergeSegments')return mergeSegments();if(a==='appendImport')return $('#fileAppendImport')?.click();if(a==='sampleCsv')return downloadText('tsw-routes-voorbeeld.csv',CSV_SAMPLE,'text/csv;charset=utf-8');if(a==='sampleJson')return downloadText('tsw-routes-voorbeeld.json',JSON.stringify(JSON_SAMPLE,null,2)+'\n','application/json');if(a==='addRoute')return addRoute();if(a==='addSegment')return addSegment();if(a==='deleteRoute'){if(!confirm('Route inclusief segmenten verwijderen?'))return;routes=routes.filter(x=>x.id!==rr.id);ensure();clearTimes();return refresh();}if(a==='deleteSegment'){if(!confirm('Dit segment verwijderen?'))return;rr.segments=rr.segments.filter(x=>x.id!==ss.id);segmentId=rr.segments[0]?.id;ensure();clearTimes();return refresh();}if(a==='reverse'){let reversed=[...ss.stops].reverse(),x=segment(ss.name+' (terug)',reversed.map(p=>p.name));for(let i=1;i<x.stops.length;i++){let other=ss.stops[ss.stops.length-i];x.stops[i].distanceKm=parseDistance(other?.distanceKm);x.stops[i].distanceKind=other?.distanceKind||null;}for(let i=0;i<x.stops.length;i++){let other=ss.stops[ss.stops.length-1-i];x.stops[i].latitude=other.latitude??null;x.stops[i].longitude=other.longitude??null;x.stops[i].geoLabel=other.geoLabel||'';}for(let f of ss.trackFacts||[]){let from=ss.stops.findIndex(st=>st.id===f.fromId),to=ss.stops.findIndex(st=>st.id===f.toId);if(from<0||to<0||Math.abs(from-to)!==1)continue;x.trackFacts.push({...f,id:newid(),fromId:x.stops[ss.stops.length-1-from].id,toId:x.stops[ss.stops.length-1-to].id});}rr.segments.push(x);segmentId=x.id;phase='segments';clearTimes();refresh();return notify('Rijrichting met bijzonderheden toegevoegd en opgeslagen.');}if(a==='addStop'){let insertAt=Math.max(1,ss.stops.length-1);ss.stops.splice(insertAt,0,stop(''));if(ss.stops[insertAt+1]){ss.stops[insertAt+1].distanceKm=null;ss.stops[insertAt+1].distanceKind=null;}calculateGeoDistances(ss);return refresh();}if(a==='deleteStop'){let i=ss.stops.findIndex(p=>p.id===id);if(i<0)return;if(ss.stops[i+1]){ss.stops[i+1].distanceKm=null;ss.stops[i+1].distanceKind=null;}ss.stops.splice(i,1);if(ss.stops[0])ss.stops[0].distanceKm=null;ss.stops[0].distanceKind=null;calculateGeoDistances(ss);delete times[id];return refresh();}if(a==='up'||a==='down'){let i=ss.stops.findIndex(p=>p.id===id),j=i+(a==='up'?-1:1);if(i>=0&&j>=0&&j<ss.stops.length){[ss.stops[i],ss.stops[j]]=[ss.stops[j],ss.stops[i]];for(let k=Math.max(1,Math.min(i,j));k<=Math.min(ss.stops.length-1,Math.max(i,j)+1);k++){ss.stops[k].distanceKm=null;ss.stops[k].distanceKind=null;}ss.stops[0].distanceKm=null;ss.stops[0].distanceKind=null;calculateGeoDistances(ss);}return refresh();}if(a==='saveSegment'){save();return notify('Segment en haltes opgeslagen.');}if(a==='tabTimes'){if(ss.stops.some(p=>!p.name.trim()))return notify('Geef eerst ieder station een naam.');phase='times';render();beginGeoLookupIfNeeded();return;}if(a==='tabSegments'){phase='segments';return render();}if(a==='clearTimes'){if(!confirm('Tijden voor deze rit wissen? De opgeslagen haltes blijven staan.'))return;clearTimes();render();return;}if(a==='start')return start();if(a==='arrive'){if(run&&run.index<run.stops.length-1){run.index++;stationInfoIndex=run.index;trackInfoIndex=Math.min(run.index,run.stops.length-2);trackEditId=null;render();}return;}if(a==='back'){if(run&&run.index>0){run.index--;stationInfoIndex=run.index;trackInfoIndex=Math.min(run.index,run.stops.length-2);trackEditId=null;render();}return;}if(a==='pause'){if(!run)return;if(!run.paused){run.baseElapsed=elapsed();run.paused=true;}else{run.anchor=Date.now();run.paused=false;}return render();}if(a==='sync')return sync();if(a==='finish')return finish();if(a==='export')return exportData();if(a==='import')return $('#fileImport')?.click();});
$('#app').addEventListener('input',e=>{if(mode!=='setup')return;let x=e.target,ss=s(),row=x.closest('[data-id]');if(x.id==='routeName'){r().name=x.value;save();return;}if(x.id==='segmentName'){ss.name=x.value;save();return;}if(row&&x.dataset.field==='name'){let st=ss.stops.find(p=>p.id===row.dataset.id);if(st){if(st.name!==x.value){let idx=ss.stops.indexOf(st);st.name=x.value;st.latitude=null;st.longitude=null;st.geoLabel='';for(let k=idx;k<=idx+1;k++){if(k>0&&['air','rail'].includes(ss.stops[k]?.distanceKind)){ss.stops[k].distanceKm=null;ss.stops[k].distanceKind=null;}}}save();}return;}if(row&&x.dataset.field==='distanceKm'){let st=ss.stops.find(p=>p.id===row.dataset.id);if(st){st.distanceKm=parseDistance(x.value);st.distanceKind=st.distanceKm===null?null:'manual';let label=row.querySelector('[data-geolabel]');if(label){label.textContent=st.distanceKm===null?'Nog onbekend':'Handmatig ingevuld';label.classList.remove('auto');label.classList.add('manual');}save();}return;}if(row&&x.dataset.time){times[row.dataset.id]??={};times[row.dataset.id][x.dataset.time]=x.value;}});
$('#app').addEventListener('change',e=>{let x=e.target;if(x.id==='trackLegSelect'){trackInfoIndex=Math.max(0,Math.min(trackStops().length-2,Number(x.value)||0));trackEditId=null;return render();}if(x.id==='infoStationSelect'){stationInfoIndex=Math.max(0,Math.min(run.stops.length-1,Number(x.value)||0));return render();}if(x.id==='fileImport'){let file=x.files?.[0];x.value='';return importData(file);}if(x.id==='fileAppendImport'){let file=x.files?.[0];x.value='';return importAdditional(file);}if(x.id==='routeSelect'){routeId=x.value;segmentId=r().segments[0]?.id;clearTimes();phase='segments';return refresh();}if(x.id==='segmentSelect'){segmentId=x.value;clearTimes();phase='segments';return refresh();}if(x.id==='routeName'||x.id==='segmentName'){let current=x.id==='routeName'?r():s();current.name=x.value;save();return;}});
document.addEventListener('change',e=>{if(e.target.matches('#timePickerOverlay [data-picker-unit]'))pickerUpdatePreview();});
document.addEventListener('click',e=>{let root=e.target.closest('#timePickerOverlay');if(!root)return;if(e.target===root){closeTimePicker();return;}let b=e.target.closest('button[data-tp]');if(!b)return;let action=b.dataset.tp;if(action==='close')return closeTimePicker();if(action==='apply')return commitTimePicker();if(action==='clear')return commitTimePicker({clear:true});if(action==='next')return commitTimePicker({goNext:true});if(action==='adjust'){let v=pickerSelection();if(v!==null)pickerSet(v+(Number(b.dataset.offset)||0));}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeTimePicker){closeTimePicker();return;}if(e.key==='Escape'&&trackInfoOpen){showTrackInfo(false);}else if(e.key==='Escape'&&stationInfoOpen){showStationInfo(false);}});
ensure();save();render();setInterval(updateClock,250);
})();
