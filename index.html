<style>

*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg)}body{margin:0;color:var(--text);min-height:100dvh;background:radial-gradient(ellipse at 70% -10%,#1a3553 0,transparent 44%),var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}input,select{color:var(--text);background:#091829;border:1px solid #35516a;border-radius:11px;min-height:44px;padding:10px 12px;width:100%;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #53b7ff22}input[type=time]{min-width:0;max-width:100%;color-scheme:dark}input::placeholder{color:#748ba2}option{background:#101f31}button{border:0;border-radius:11px;font-weight:750;min-height:43px;padding:10px 14px;transition:filter .15s}button:hover:not(:disabled){filter:brightness(1.08)}button:active:not(:disabled){transform:translateY(1px)}.btn-primary{background:var(--mint);color:#082a26}.btn-blue{background:var(--blue);color:#07233b}.btn-soft{background:#213a54;color:var(--text);border:1px solid #34516a}.btn-ghost{background:transparent;color:#c3d7e8;border:1px solid #36526c}.btn-danger{background:#442d41;color:#ffd6d9;border:1px solid #734052}.btn-small{min-height:34px;padding:7px 10px;font-size:12px}.icon-btn{min-width:35px;min-height:35px;padding:6px 9px}.w100{width:100%}.app{max-width:1280px;margin:0 auto;padding:24px 24px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,#58e0b2,#56b9ff);color:#092239;font-weight:1000;font-size:23px;box-shadow:0 6px 24px #3fd4be2c}.brand h1{font-size:20px;margin:0;letter-spacing:.015em}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.tag{border:1px solid #33536b;border-radius:999px;font-size:11px;padding:7px 11px;color:#b2cbdc;white-space:nowrap}.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint);font-weight:850}.headline{font-size:clamp(25px,3.5vw,40px);font-weight:850;letter-spacing:-.045em;margin:9px 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.intro{font-size:14px;max-width:720px;line-height:1.6;margin:0 0 20px}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}.panel{background:linear-gradient(145deg,#12243a,#0f1e32);border:1px solid #29415a;border-radius:19px;box-shadow:var(--shadow)}.sidebar{padding:22px}.section-title{font-size:13px;letter-spacing:.02em;font-weight:800;margin:0 0 11px}.field{margin:0 0 16px}.field label{display:block;font-size:12px;color:#bdd0df;margin-bottom:7px}.button-row{display:flex;gap:8px;flex-wrap:wrap}.button-row button{flex:1}.separator{height:1px;background:var(--line);margin:21px 0}.editor{padding:24px}.ed-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:22px}.ed-head h2{margin:6px 0;font-size:25px;letter-spacing:-.03em}.ed-head p{margin:0;font-size:13px;line-height:1.55}.pill{display:inline-block;border-radius:30px;padding:7px 10px;background:#213a4d;color:#c4d9e9;font-size:12px;white-space:nowrap}.station-header,.station-row{display:grid;grid-template-columns:minmax(130px,1.75fr) minmax(104px,.8fr) minmax(104px,.8fr) 120px;gap:10px;align-items:center}.station-header{padding:0 10px 11px;color:#98b0c3;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.station-row{border:1px solid #2a425b;border-radius:15px;padding:12px 10px;margin-bottom:10px;background:#14273e}.station-name{display:flex;align-items:center;gap:9px}.num{display:grid;place-items:center;background:#27455e;border:1px solid #385a74;flex:none;color:#bddef0;font-weight:800;font-size:12px;width:28px;height:28px;border-radius:9px}.station-row input{font-size:14px}.time-label{display:none}.row-actions{display:flex;gap:4px;justify-content:flex-end}.action-detail{font-size:11px;margin:5px 0 0;color:var(--muted)}.notice{border-radius:12px;border:1px solid #496381;background:#142d45;padding:13px 15px;color:#c4d8eb;font-size:13px;line-height:1.5}.notice.warn{border-color:#806344;background:#3d2f24;color:#ffe1ab}.bottom-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}.start-btn{min-width:200px;min-height:52px;font-size:17px}.run-screen{max-width:970px;margin:auto}.run-header{display:flex;gap:15px;justify-content:space-between;align-items:start;margin-bottom:19px}.run-header h2{font-size:clamp(23px,4vw,36px);margin:9px 0 3px;letter-spacing:-.035em}.run-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{background:#102238;border:1px solid #29455e;border-radius:15px;padding:15px;min-height:85px}.metric .label{display:block;color:#93aec4;font-size:10px;letter-spacing:.12em;font-weight:800;margin-bottom:8px}.metric .value{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.run-dashboard{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.85fr);gap:16px;align-items:start}.route-panel{padding:23px}.route-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 0 15px}.route-title h3{margin:0;font-size:17px}.station-line{position:relative;max-height:570px;overflow:auto;padding:3px 5px 7px 0;scrollbar-color:#41647f transparent}.line-stop{display:grid;grid-template-columns:40px minmax(0,1fr);position:relative;min-height:76px}.line-stop:not(:last-child):before{content:"";position:absolute;left:16px;top:29px;bottom:-11px;width:3px;background:#405b72;border-radius:3px}.line-stop.done:not(:last-child):before{background:var(--mint)}.dot{z-index:1;width:21px;height:21px;margin-top:12px;margin-left:7px;border:4px solid #52708b;border-radius:50%;background:#162b43}.line-stop.done .dot{background:var(--mint);border-color:#296d66;box-shadow:0 0 0 3px #58e0b21c}.line-stop.now .dot{background:var(--amber);border-color:#aa8447;box-shadow:0 0 0 4px #ffcc7520}.line-stop.next .dot{border-color:var(--blue);background:#153c58;box-shadow:0 0 0 4px #53b7ff1a}.station-detail{padding:9px 10px 15px 13px;border-bottom:1px solid #243c52;min-width:0}.line-stop:last-child .station-detail{border-bottom:0}.stop-name{font-weight:750;font-size:16px;overflow-wrap:anywhere}.line-stop.done .stop-name{color:#86aeac}.stop-times{font-size:12px;color:#8fb0c4;display:flex;gap:13px;flex-wrap:wrap;margin-top:6px}.stop-times strong{color:#dae9f7}.stop-badge{font-size:10px;letter-spacing:.07em;font-weight:800;padding:4px 7px;margin-left:7px;border-radius:6px;color:#1d2c35;background:var(--amber);vertical-align:middle}.line-stop.next .stop-badge{color:#092c3d;background:var(--blue)}.run-side{display:flex;flex-direction:column;gap:15px}.countdown-panel{padding:23px;background:linear-gradient(145deg,#13374b,#10293d);border-color:#2d7286}.count-title{color:#a1d9e7;font-size:11px;letter-spacing:.14em;font-weight:850}.next-name{font-size:clamp(22px,3.5vw,30px);font-weight:850;line-height:1.15;margin:12px 0 7px;overflow-wrap:anywhere}.count-big{font-size:clamp(44px,7vw,63px);font-variant-numeric:tabular-nums;letter-spacing:-.07em;font-weight:850;line-height:1.12;margin-top:20px;color:#efffff}.count-big.late{color:var(--amber)}.status{font-size:12px;color:#a7d9d6;margin-top:8px}.time-duo{display:flex;gap:12px;justify-content:space-between;margin-top:18px;border-top:1px solid #37617a;padding-top:13px}.time-duo>div{flex:1}.time-duo span{display:block;font-size:10px;color:#9fc0d0;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}.time-duo strong{font-size:21px;font-variant-numeric:tabular-nums}.controls{padding:19px}.controls h4{margin:0 0 12px;font-size:13px}.arrive{font-size:20px;min-height:65px;margin-bottom:11px}.controls-row{display:flex;gap:9px}.controls-row button{flex:1;font-size:12px}.clock-row{margin-top:17px;border-top:1px solid #2e4861;padding-top:16px}.clock-row label{display:block;font-size:11px;color:#aec5d5;margin-bottom:7px}.clock-box{display:flex;gap:8px}.clock-box input{flex:1;min-width:0}.end-message{color:var(--mint);font-weight:800;font-size:14px;margin:6px 0 12px}.empty{text-align:center;padding:25px;color:var(--muted)}.footer{font-size:11px;color:#7d9aaf;margin-top:22px;text-align:center;line-height:1.7}.toast{position:fixed;bottom:21px;left:50%;transform:translateX(-50%);background:#d9fff3;color:#0b382d;border-radius:12px;padding:12px 17px;box-shadow:0 10px 30px #0006;font-weight:700;font-size:13px;z-index:10;max-width:calc(100vw - 30px)}.hidden{display:none!important}
@media(max-width:880px){.layout{grid-template-columns:1fr}.run-dashboard{grid-template-columns:1fr}.run-side{display:grid;grid-template-columns:1fr 1fr}.run-screen{max-width:720px}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.sidebar .separator{grid-column:1/-1}.sidebar .wide{grid-column:1/-1}.station-line{max-height:480px}}
@media(max-width:620px){.app{padding:17px 12px 78px}.top{margin-bottom:17px}.brand h1{font-size:17px}.tag{font-size:10px}.sidebar{display:block;padding:17px}.editor{padding:16px}.ed-head{display:block}.ed-head .pill{margin-top:12px}.station-header{display:none}.station-row{grid-template-columns:1fr 1fr;gap:9px;padding:12px}.station-name{grid-column:1/-1}.time-label{display:block;color:#a3b8ca;font-size:10px;margin:0 0 5px;letter-spacing:.06em}.row-actions{grid-column:1/-1;justify-content:flex-end}.row-actions button{min-width:43px}.bottom-actions{display:block}.bottom-actions>div{margin-bottom:12px}.start-btn{width:100%}.run-metrics{gap:8px}.metric{min-height:79px;padding:11px 10px}.metric .value{font-size:14px}.metric .label{font-size:9px}.route-panel,.countdown-panel{padding:17px}.run-side{display:flex}.run-header{align-items:center}.run-header button{font-size:12px}.station-line{max-height:460px}.run-screen .headline{font-size:27px}.controls{padding:18px}.intro{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body><div id="app"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='tsw_routeregie_v1';
const newId=()=>('id'+Math.random().toString(36).slice(2,10));
const stop=n=>({id:newId(),name:n,arrival:'',departure:''});
const makeSegment=(name,stationNames)=>({id:newId(),name,stops:stationNames.map(stop)});
const exampleRoute=()=>{const main=['Brighton','London Road','Moulsecoomb','Falmer','Lewes'];return {id:newId(),name:'East Coastway',segments:[makeSegment('Brighton → Lewes',main),makeSegment('Lewes → Brighton',[...main].reverse())]};};
let routes=[exampleRoute()],selectedRoute=routes[0].id,selectedSegment=routes[0].segments[0].id,mode='setup',run=null,toastTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
function normalizeRoute(raw){if(!raw||typeof raw!=='object')return null;const segments=Array.isArray(raw.segments)?raw.segments.slice(0,200).map(s=>({id:String(s.id||newId()),name:String(s.name||'Segment'),stops:Array.isArray(s.stops)?s.stops.slice(0,150).map(p=>({id:String(p.id||newId()),name:String(p.name||''),arrival:/^\d\d:\d\d$/.test(p.arrival||'')?p.arrival:'',departure:/^\d\d:\d\d$/.test(p.departure||'')?p.departure:''})):[]})):[];return {id:String(raw.id||newId()),name:String(raw.name||'Nieuwe route'),segments};}
try{const data=JSON.parse(localStorage.getItem(KEY)||'null');if(data&&Array.isArray(data.routes)&&data.routes.length){routes=data.routes.slice(0,100).map(normalizeRoute).filter(Boolean);selectedRoute=data.selectedRoute;selectedSegment=data.selectedSegment;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({routes,selectedRoute,selectedSegment}));}catch(e){}}
function route(){return routes.find(r=>r.id===selectedRoute)||routes[0];}
function segment(){return route()?.segments.find(s=>s.id===selectedSegment)||route()?.segments[0];}
function ensureSelection(){if(!routes.length)routes=[exampleRoute()];let r=route();selectedRoute=r.id;if(!r.segments.length)r.segments=[makeSegment('Segment 1',['Vertrekstation','Eindstation'])];let s=segment();selectedSegment=s.id;}
ensureSelection();save();
const parseMin=t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t||'')?(Number(t.slice(0,2))*60+Number(t.slice(3,5))):null;
const clockString=(minutes)=>{let m=((Math.floor(minutes)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const fmtSeconds=s=>{let v=Math.abs(Math.ceil(s));return (v>=3600?String(Math.floor(v/3600)).padStart(2,'0')+':':'')+String(Math.floor(v%3600/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');};
function planFor(s){const first=parseMin(s?.stops?.[0]?.departure||'');if(first===null)return {base:null,times:[],error:null};let previous=first,times=[];for(let i=0;i<s.stops.length;i++){let p=s.stops[i];let entry={arrival:null,departure:null};for(const part of (i===0?['departure']:['arrival','departure'])){let val=parseMin(p[part]||'');if(val===null)continue;let absolute=Math.floor(previous/1440)*1440+val;if(absolute<previous){if(previous-absolute>720)absolute+=1440;else return {base:first,times,error:`De tijd bij ${p.name||'station '+(i+1)} (${part==='arrival'?'aankomst':'vertrek'}) ligt vóór de vorige tijd. Controleer de tijden.`};}entry[part]=absolute-first;previous=absolute;}times.push(entry);}return {base:first,times,error:null};}
function showToast(msg){const e=$('#toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),3500);}
function header(){return `<header class="top"><div class="brand"><div class="logo" aria-hidden="true">↗</div><div><h1>TSW RouteRegie</h1><p>Jouw persoonlijke stationsvolger</p></div></div><span class="tag">● SAFARI · LOKAAL</span></header>`;}
function toolbar(){return `<div class="button-row"><button type="button" class="btn-soft btn-small" data-action="export">↓ Back-up</button><button type="button" class="btn-soft btn-small" data-action="import">↑ Importeren</button><input class="hidden" id="importFile" type="file" accept="application/json,.json"></div>`;}
function setupView(){ensureSelection();let r=route(),s=segment(),p=planFor(s),filled=s.stops.filter(x=>x.arrival||x.departure).length;return `${header()}<div class="kicker">Voorbereiding / rit aanmaken</div><h2 class="headline">Bouw je eigen dienst.</h2><p class="muted intro">Maak routes en segmenten aan. Vul per segment de stations en je eigen aankomst- en vertrektijden in. Druk op <strong>Start rit</strong> wanneer je in Train Sim World vertrekt.</p><div class="layout"><aside class="panel sidebar"><div><h3 class="section-title">01 / Route kiezen</h3><div class="field"><label for="routeSelect">Route</label><select id="routeSelect">${routes.map(x=>`<option value="${attr(x.id)}" ${x.id===r.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="button-row"><button type="button" class="btn-blue btn-small" data-action="addRoute">+ Route</button><button type="button" class="btn-danger btn-small" data-action="removeRoute">Verwijder</button></div><div class="field" style="margin-top:15px"><label for="routeName">Naam van route</label><input id="routeName" maxlength="90" placeholder="Bijv. East Coastway" value="${attr(r.name)}"></div></div><div class="separator"></div><div><h3 class="section-title">02 / Segment kiezen</h3><div class="field"><label for="segmentSelect">Segment / rijrichting</label><select id="segmentSelect">${r.segments.map(x=>`<option value="${attr(x.id)}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="button-row"><button type="button" class="btn-blue btn-small" data-action="addSegment">+ Segment</button><button type="button" class="btn-danger btn-small" data-action="removeSegment">Verwijder</button></div><div class="field" style="margin-top:15px"><label for="segmentName">Naam van segment</label><input id="segmentName" maxlength="100" value="${attr(s.name)}" placeholder="Bijv. Brighton → Lewes"></div><button type="button" class="btn-ghost btn-small w100" data-action="reverse">⇄ Maak omgekeerde rijrichting</button><p class="action-detail">Bij omkeren worden stations overgenomen, maar tijden leeg gelaten.</p></div><div class="separator"></div><div class="wide"><h3 class="section-title">03 / Bewaren en meenemen</h3><p class="small muted" style="line-height:1.6">Je invoer wordt automatisch op dit apparaat bewaard. Maak af en toe een back-up als JSON-bestand.</p>${toolbar()}</div></aside><main class="panel editor"><div class="ed-head"><div><div class="kicker">${esc(r.name)}</div><h2>${esc(s.name)}</h2><p class="muted">Bepaal hier zelf de stopvolgorde. Alleen de stations die je invult verschijnen straks op de routelijn.</p></div><span class="pill">${s.stops.length} stations · ${filled} met tijd</span></div><div class="station-header"><div>Station</div><div>Aankomst</div><div>Vertrek</div><div style="text-align:right">Volgorde</div></div><div id="stations">${s.stops.map((x,i)=>`<div class="station-row" data-id="${attr(x.id)}"><div class="station-name"><span class="num">${i+1}</span><input data-field="name" aria-label="Station ${i+1}" maxlength="120" value="${attr(x.name)}" placeholder="Stationnaam"></div><div><div class="time-label">AANKOMST</div><input data-field="arrival" aria-label="Aankomst ${esc(x.name||i+1)}" type="time" value="${attr(x.arrival)}" ${i===0?'disabled title="Beginstation heeft geen aankomsttijd nodig"':''}></div><div><div class="time-label">VERTREK</div><input data-field="departure" aria-label="Vertrek ${esc(x.name||i+1)}" type="time" value="${attr(x.departure)}" ${i===s.stops.length-1?'disabled title="Eindstation heeft geen vertrektijd nodig"':''}></div><div class="row-actions"><button type="button" class="btn-soft icon-btn" title="Station omhoog" aria-label="Station omhoog" data-action="up" data-id="${attr(x.id)}" ${i===0?'disabled':''}>↑</button><button type="button" class="btn-soft icon-btn" title="Station omlaag" aria-label="Station omlaag" data-action="down" data-id="${attr(x.id)}" ${i===s.stops.length-1?'disabled':''}>↓</button><button type="button" class="btn-danger icon-btn" title="Verwijder station" aria-label="Verwijder station" data-action="removeStop" data-id="${attr(x.id)}" ${s.stops.length<=2?'disabled':''}>×</button></div></div>`).join('')}</div><button type="button" class="btn-soft" data-action="addStop">+ Station toevoegen</button><p class="action-detail">Voor de countdown gebruik je het vertrek van het eerste station en de aankomst van de volgende stations. Vertrektijden bij tussenstations zijn optioneel. Nachtritten over 00:00 worden ondersteund.</p>${p.error?`<div class="notice warn" style="margin-top:15px">⚠ ${esc(p.error)}</div>`:`<div class="notice" style="margin-top:15px">ⓘ De klok begint op de <strong>vertrektijd van het eerste station</strong> zodra je op Start drukt. De app leest de spelklok niet rechtstreeks uit. Je kunt de klok tijdens de rit handmatig bijstellen.</div>`}<div class="bottom-actions"><div class="small muted">${esc(s.stops[0]?.name||'Vertrek')} → ${esc(s.stops[s.stops.length-1]?.name||'Bestemming')}</div><button type="button" class="btn-primary start-btn" data-action="start" ${p.error?'disabled':''}>▶ Start rit</button></div></main></div><div class="footer">Werkt zonder server of account. Bewaar je gegevens met Back-up als je van apparaat wisselt.</div>`;}
function elapsed(){if(!run)return 0;return run.baseElapsed+(run.paused?0:(Date.now()-run.anchor)/1000);}
function arriveTarget(s,index){const t=run?.plan?.times[index];return t?(t.arrival!==null?t.arrival:t.departure):null;}
function countdownData(s){if(!run||run.index>=s.stops.length-1)return {value:'—',late:false,text:'Eindstation bereikt'};let target=arriveTarget(s,run.index+1);if(target===null||run.plan.base===null)return {value:'—:—',late:false,text:'Geen aankomsttijd ingevuld'};let diff=target*60-elapsed();return {value:fmtSeconds(diff),late:diff<0,text:diff<0?'Volgens planning verstreken':run.paused?'Rit gepauzeerd':'Tot de geplande aankomst'};}
function renderRun(){let r=route(),s=segment(),pos=run?.index||0,next=s.stops[pos+1],from=s.stops[0],to=s.stops[s.stops.length-1];let c=countdownData(s),target=next?arriveTarget(s,pos+1):null,cur=run?.plan.times[pos],ftime=run.plan.base;return `${header()}<section class="run-screen"><div class="run-header"><div><div class="kicker">Rit actief · ${esc(r.name)}</div><h2>${esc(s.name)}</h2><div class="small muted">${s.stops.length} stations · Handmatig bevestigen bij aankomst</div></div><button type="button" class="btn-ghost btn-small" data-action="editRun">✎ Bewerken</button></div><div class="run-metrics"><div class="metric"><span class="label">VERTREKSTATION</span><span class="value">${esc(from.name||'—')}</span></div><div class="metric"><span class="label">EINDBESTEMMING</span><span class="value">${esc(to.name||'—')}</span></div><div class="metric"><span class="label">SPELKLOK (SCHATTING)</span><span class="value" id="gameClock">${ftime===null?'—:—':clockString(ftime+elapsed()/60)}</span></div></div><div class="run-dashboard"><section class="panel route-panel"><div class="route-title"><h3>Routelijn</h3><span class="pill">${Math.min(pos+1,s.stops.length)} / ${s.stops.length}</span></div><div class="station-line" id="timeline" aria-label="Routelijn en stations">${s.stops.map((p,i)=>{let t=run.plan.times[i]||{};let type=i<pos?'done':i===pos?'now':i===pos+1?'next':'future';let badge=i===pos?'<span class="stop-badge">HIER</span>':i===pos+1?'<span class="stop-badge">VOLGENDE</span>':'';return `<div class="line-stop ${type}" data-stop-index="${i}"><div class="dot"></div><div class="station-detail"><div class="stop-name">${esc(p.name||'Naamloos station')}${badge}</div><div class="stop-times"><span>Aank. <strong>${esc(p.arrival||'—:—')}</strong></span><span>Vert. <strong>${esc(p.departure||'—:—')}</strong></span></div></div></div>`;}).join('')}</div></section><aside class="run-side"><div class="panel countdown-panel"><div class="count-title">${next?'VOLGENDE STATION':'RIT VOLTOOID'}</div><div class="next-name">${esc(next?.name||'Eindbestemming bereikt')}</div><div class="count-big ${c.late?'late':''}" id="countdown">${c.value}</div><div class="status" id="countStatus">${esc(c.text)}</div><div class="time-duo"><div><span>Vertrek huidige halte</span><strong>${esc(s.stops[pos]?.departure||'—:—')}</strong></div><div><span>Aankomst volgende halte</span><strong>${esc(next?.arrival||next?.departure||'—:—')}</strong></div></div></div><div class="panel controls">${!next?'<p class="end-message">✓ Je hebt je eindstation bereikt.</p>':''}<button type="button" class="btn-primary arrive w100" data-action="arrive" ${!next?'disabled':''}>✓ Aangekomen</button><div class="controls-row"><button type="button" class="btn-soft" data-action="back" ${pos===0?'disabled':''}>← Vorig station</button><button type="button" class="btn-soft" data-action="pause">${run.paused?'▶ Hervatten':'Ⅱ Pauze'}</button></div><div class="clock-row"><label for="syncClock">Spelklok bijstellen (optioneel)</label><div class="clock-box"><input id="syncClock" type="time" aria-label="Huidige speltijd" value="${ftime===null?'':clockString(ftime+elapsed()/60)}"><button type="button" class="btn-blue btn-small" data-action="sync">Sync</button></div><p class="action-detail">Stel de klok gelijk aan de tijd die Train Sim World nu toont.</p></div><div class="separator" style="margin:14px 0"></div><button type="button" class="btn-ghost btn-small w100" data-action="finish">■ Rit afsluiten</button></div></aside></div><div class="footer">De klok loopt vanaf het moment van starten. Hij volgt niet automatisch de spelklok. De stations veranderen alleen met de knop Aangekomen.</div></section>`;}
function render(){ensureSelection();$('#app').innerHTML=`<div class="app">${mode==='run'&&run?renderRun():setupView()}</div>`;if(mode==='run'&&run){updateClock();const cur=$(`[data-stop-index="${run.index}"]`);if(cur){setTimeout(()=>cur.scrollIntoView({block:'nearest',behavior:'smooth'}),0);}}}
function updateClock(){if(mode!=='run'||!run)return;const c=countdownData(segment());let n=$('#countdown');if(n){n.textContent=c.value;n.classList.toggle('late',c.late);}let cs=$('#countStatus');if(cs)cs.textContent=c.text;let cl=$('#gameClock');if(cl)cl.textContent=run.plan.base===null?'—:—':clockString(run.plan.base+elapsed()/60);}
function updateAndRender(){save();render();}
function addRoute(){let r={id:newId(),name:'Nieuwe route',segments:[makeSegment('Segment 1',['Vertrekstation','Eindstation'])]};routes.push(r);selectedRoute=r.id;selectedSegment=r.segments[0].id;updateAndRender();$('#routeName')?.focus();$('#routeName')?.select();}
function addSegment(){let r=route(),s=makeSegment('Nieuw segment',['Vertrekstation','Eindstation']);r.segments.push(s);selectedSegment=s.id;updateAndRender();$('#segmentName')?.focus();$('#segmentName')?.select();}
function start(){let s=segment();if(s.stops.length<2||s.stops.some(x=>!x.name.trim()))return showToast('Vul minimaal twee stations in en geef ieder station een naam.');let p=planFor(s);if(p.error)return showToast(p.error);run={index:0,plan:p,baseElapsed:0,anchor:Date.now(),paused:false};mode='run';render();if(p.base===null)showToast('Rit gestart. Vul voor een countdown later tijden in.');else if(s.stops.slice(1).some((_,i)=>arriveTarget(s,i+1)===null))showToast('Rit gestart. Bij stations zonder aankomsttijd is er geen countdown.');}
function adjustClock(){let value=$('#syncClock')?.value;let target=parseMin(value),base=run.plan.base;if(target===null)return showToast('Vul een geldige speltijd in.');if(base===null){showToast('Vul eerst de vertrektijd van het beginstation in.');return;}let raw=target-base;let current=elapsed()/60;while(raw-current>720)raw-=1440;while(current-raw>720)raw+=1440;run.baseElapsed=raw*60;run.anchor=Date.now();render();showToast('Spelklok bijgesteld.');}
function download(){const payload={format:'TSW RouteRegie',version:1,routes};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tsw-routeregie-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function processImport(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.routes)||!data.routes.length)throw new Error('Geen routes');let imported=data.routes.slice(0,100).map(normalizeRoute).filter(Boolean);if(!imported.length)throw new Error('Geen routes');if(!confirm(`Wil je je huidige ${routes.length} route(s) vervangen door ${imported.length} route(s) uit deze back-up?`))return;routes=imported;selectedRoute=routes[0].id;selectedSegment=routes[0].segments[0]?.id;mode='setup';run=null;updateAndRender();showToast('Routes geïmporteerd.');}catch(e){showToast('Dit bestand is geen geldige RouteRegie-back-up.');}};reader.onerror=()=>showToast('Kon het bestand niet lezen.');reader.readAsText(file);}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,r=route(),s=segment();if(action==='addRoute')return addRoute();if(action==='addSegment')return addSegment();if(action==='removeRoute'){if(!confirm(`Route "${r.name}" verwijderen, inclusief alle segmenten?`))return;routes=routes.filter(x=>x.id!==r.id);ensureSelection();return updateAndRender();}if(action==='removeSegment'){if(!confirm(`Segment "${s.name}" verwijderen?`))return;r.segments=r.segments.filter(x=>x.id!==s.id);selectedSegment=r.segments[0]?.id;ensureSelection();return updateAndRender();}if(action==='reverse'){let reversed=makeSegment(s.name+' (terug)',[...s.stops].reverse().map(x=>x.name));r.segments.push(reversed);selectedSegment=reversed.id;updateAndRender();return showToast('Omgekeerde rijrichting toegevoegd zonder tijden.');}if(action==='addStop'){s.stops.splice(Math.max(1,s.stops.length-1),0,stop(''));updateAndRender();const last=$('#stations .station-row:nth-last-child(2) [data-field="name"]');last?.focus();return;}if(action==='removeStop'){s.stops=s.stops.filter(x=>x.id!==id);return updateAndRender();}if(action==='up'||action==='down'){let i=s.stops.findIndex(x=>x.id===id),j=i+(action==='up'?-1:1);if(i>=0&&j>=0&&j<s.stops.length){[s.stops[i],s.stops[j]]=[s.stops[j],s.stops[i]];updateAndRender();}return;}if(action==='start')return start();if(action==='arrive'){if(run&&run.index<s.stops.length-1){run.index++;render();}return;}if(action==='back'){if(run&&run.index>0){run.index--;render();}return;}if(action==='pause'){if(!run)return;if(!run.paused){run.baseElapsed=elapsed();run.paused=true;}else{run.anchor=Date.now();run.paused=false;}return render();}if(action==='sync')return adjustClock();if(action==='finish'||action==='editRun'){if(action==='editRun'&&!confirm('Rit stoppen om stations of tijden te bewerken?'))return;run=null;mode='setup';return render();}if(action==='export')return download();if(action==='import')return $('#importFile')?.click();});
$('#app').addEventListener('input',e=>{let el=e.target;if(mode!=='setup')return;let r=route(),s=segment();if(el.id==='routeName'){r.name=el.value;save();return;}if(el.id==='segmentName'){s.name=el.value;save();return;}const row=el.closest('.station-row');if(row&&el.dataset.field){let p=s.stops.find(x=>x.id===row.dataset.id);if(p){p[el.dataset.field]=el.value;save();}}});
$('#app').addEventListener('change',e=>{let el=e.target;if(el.id==='importFile'){processImport(el.files?.[0]);return;}if(el.id==='routeSelect'){selectedRoute=el.value;selectedSegment=route().segments[0]?.id;return updateAndRender();}if(el.id==='segmentSelect'){selectedSegment=el.value;return updateAndRender();}if(['routeName','segmentName'].includes(el.id)||el.closest('.station-row')){if(el.id==='routeName'){route().name=el.value;const o=$('#routeSelect option:checked');if(o)o.textContent=el.value;}else if(el.id==='segmentName'){segment().name=el.value;const o=$('#segmentSelect option:checked');if(o)o.textContent=el.value;}else{const row=el.closest('.station-row');const st=segment().stops.find(x=>x.id===row?.dataset.id);if(st&&el.dataset.field)st[el.dataset.field]=el.value;}save();return;}});
setInterval(updateClock,250);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClock();});render();
})();
</script></body></html>
